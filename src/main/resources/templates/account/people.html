<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="min-h-screen bg-canvas font-sans antialiased">
<nav th:replace="~{fragments/nav :: nav}"></nav>
<main class="mx-auto max-w-5xl px-4 py-8 sm:px-6 lg:px-8">
    <nav th:replace="~{fragments/ui :: breadcrumbs(null, null, null)}"></nav>
    <div class="mt-2 flex items-start justify-between gap-x-4">
        <div class="min-w-0">
            <h1 class="text-2xl/8 font-bold tracking-tight text-gray-900 sm:truncate sm:text-3xl/9">
                People in <span th:text="${account.name}">Company</span>
            </h1>
            <!-- <p class="mt-1 text-sm text-gray-500">
                Everyone here can be added to this account's projects.
                <th:block th:if="${isAdmin}">Owners and admins manage people and every project.</th:block>
            </p> -->
        </div>
        <a th:if="${isAdmin}" th:href="@{/{accountId}/settings(accountId=${session.currentAccount.id})}"
           class="shrink-0 rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 shadow-xs inset-ring inset-ring-gray-300 hover:bg-gray-50">
            Account settings
        </a>
    </div>

    <div class="mt-6" th:if="${message != null or error != null}">
        <div th:replace="~{fragments/ui :: alerts}"></div>
    </div>

    <!-- Invite -->
    <form th:if="${isAdmin}" th:action="@{/{accountId}/invitations(accountId=${session.currentAccount.id})}" method="post"
          class="mt-8 rounded-xl bg-white p-4 shadow-xs ring-1 ring-gray-900/5 sm:p-6">
        <h2 class="text-base font-semibold text-gray-900">Invite someone</h2>
        <p class="mt-1 text-sm text-gray-500">First you’ll invite them to the account. Then you can add them to projects.</p>
        <div class="mt-4 flex flex-col gap-3 sm:flex-row">
            <label for="invite-email" class="sr-only">Email address</label>
            <input id="invite-email" type="email" name="email" required placeholder="name@company.com"
                   class="block w-full min-w-0 rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-sky-600 sm:text-sm/6"/>
            <div class="grid shrink-0 grid-cols-1">
                <label for="invite-role" class="sr-only">Role</label>
                <select id="invite-role" name="role"
                        class="col-start-1 row-start-1 w-full appearance-none rounded-md bg-white py-1.5 pr-8 pl-3 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 focus:outline-2 focus:-outline-offset-2 focus:outline-sky-600 sm:text-sm/6">
                    <option value="member">Member</option>
                    <option value="admin">Admin</option>
                </select>
                <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" class="pointer-events-none col-start-1 row-start-1 mr-2 size-5 self-center justify-self-end text-gray-500 sm:size-4">
                    <path d="M4.22 6.22a.75.75 0 0 1 1.06 0L8 8.94l2.72-2.72a.75.75 0 1 1 1.06 1.06l-3.25 3.25a.75.75 0 0 1-1.06 0L4.22 7.28a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd" fill-rule="evenodd" />
                </svg>
            </div>
            <button type="submit"
                    class="shrink-0 rounded-md bg-sky-600 px-3 py-2 text-sm font-semibold text-white shadow-xs hover:bg-sky-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-600">
                Send invitation
            </button>
        </div>
    </form>

    <!-- People -->
    <ul role="list" class="mt-8 divide-y divide-gray-100 rounded-xl bg-white shadow-xs ring-1 ring-gray-900/5">
        <li th:each="person : ${people}" th:with="self=${person.user.id == currentUser.id}"
            class="flex items-center justify-between gap-x-6 px-4 py-4 sm:px-6">
            <div class="flex min-w-0 items-center gap-x-4">
                <img th:replace="~{fragments/ui :: avatar(${person.user}, 'size-10')}">
                <div class="min-w-0">
                    <p class="text-sm/6 font-semibold text-gray-900">
                        <span th:text="${person.user.firstName + ' ' + person.user.lastName}"></span>
                        <span th:if="${self}" class="font-normal text-gray-500">(you)</span>
                    </p>
                    <p class="truncate text-xs/5 text-gray-500" th:text="${person.user.email}"></p>
                </div>
            </div>
            <div class="flex shrink-0 items-center gap-x-3">
                <span th:if="${person.role == 'owner'}" class="inline-flex items-center rounded-md bg-sky-50 px-2 py-1 text-xs font-medium text-sky-700 inset-ring inset-ring-sky-700/10">Owner</span>
                <span th:if="${person.role == 'admin'}" class="inline-flex items-center rounded-md bg-gray-50 px-2 py-1 text-xs font-medium text-gray-600 inset-ring inset-ring-gray-500/10">Admin</span>

                <el-dropdown th:if="${isAdmin or self}" class="relative">
                    <button class="flex items-center rounded-full p-1.5 text-gray-400 hover:bg-gray-900/5 hover:text-gray-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-600">
                        <span class="sr-only" th:text="'Options for ' + ${person.user.firstName}">Options</span>
                        <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="size-5">
                            <path d="M10 3a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3ZM10 8.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3ZM11.5 15.5a1.5 1.5 0 1 0-3 0 1.5 1.5 0 0 0 3 0Z" />
                        </svg>
                    </button>
                    <el-menu anchor="bottom end" popover
                             class="w-44 origin-top-right rounded-md bg-white py-1 shadow-lg outline-1 outline-black/5 transition transition-discrete [--anchor-gap:--spacing(2)] data-closed:scale-95 data-closed:transform data-closed:opacity-0 data-enter:duration-100 data-enter:ease-out data-leave:duration-75 data-leave:ease-in">
                        <th:block th:if="${isAdmin}">
                            <form th:if="${isOwner and person.role != 'owner'}" th:action="@{/{accountId}/people/{id}/role(accountId=${session.currentAccount.id}, id=${person.id})}" method="post">
                                <input type="hidden" name="role" value="owner"/>
                                <button type="submit" class="block w-full px-4 py-2 text-left text-sm text-gray-700 focus:bg-gray-100 focus:text-gray-900 focus:outline-hidden">Make owner</button>
                            </form>
                            <form th:if="${person.role != 'admin' and (person.role != 'owner' or isOwner)}" th:action="@{/{accountId}/people/{id}/role(accountId=${session.currentAccount.id}, id=${person.id})}" method="post">
                                <input type="hidden" name="role" value="admin"/>
                                <button type="submit" class="block w-full px-4 py-2 text-left text-sm text-gray-700 focus:bg-gray-100 focus:text-gray-900 focus:outline-hidden">Make admin</button>
                            </form>
                            <form th:if="${person.role != 'member' and (person.role != 'owner' or isOwner)}" th:action="@{/{accountId}/people/{id}/role(accountId=${session.currentAccount.id}, id=${person.id})}" method="post">
                                <input type="hidden" name="role" value="member"/>
                                <button type="submit" class="block w-full px-4 py-2 text-left text-sm text-gray-700 focus:bg-gray-100 focus:text-gray-900 focus:outline-hidden">Make member</button>
                            </form>
                        </th:block>
                        <form th:if="${self or person.role != 'owner' or isOwner}" th:action="@{/{accountId}/people/{id}/remove(accountId=${session.currentAccount.id}, id=${person.id})}" method="post"
                              onsubmit="return confirm(this.dataset.confirm)"
                              th:data-confirm="${self ? 'Leave ' + account.name + '?' : 'Remove ' + person.user.firstName + ' from ' + account.name + '? They will also be taken off its projects.'}">
                            <button type="submit" class="block w-full px-4 py-2 text-left text-sm text-red-600 focus:bg-red-50 focus:outline-hidden"
                                    th:text="${self} ? 'Leave account' : 'Remove from account'">Remove</button>
                        </form>
                    </el-menu>
                </el-dropdown>
            </div>
        </li>
    </ul>

    <!-- Pending invitations -->
    <section th:if="${isAdmin and not #lists.isEmpty(invitations)}" class="mt-10">
        <h2 class="text-base font-semibold text-gray-900">Invited, not joined yet</h2>
        <ul role="list" class="mt-4 divide-y divide-gray-100 overflow-hidden rounded-xl bg-white shadow-xs ring-1 ring-gray-900/5">
            <li th:each="invitation : ${invitations}" class="flex items-center justify-between gap-x-6 px-4 py-4 sm:px-6">
                <div class="min-w-0">
                    <p class="truncate text-sm/6 font-semibold text-gray-900" th:text="${invitation.email}"></p>
                    <p class="text-xs/5 text-gray-500">
                        <span th:text="${invitation.role == 'admin'} ? 'Admin' : 'Member'"></span>
                        · invited by <span th:text="${invitation.invitedBy.firstName}"></span>
                        on <span th:text="${#dates.format(invitation.createdAt.time, 'MMM d')}"></span>
                        <th:block th:if="${invitation.expiresAt.before(now)}"> · expired</th:block>
                    </p>
                </div>
                <form th:action="@{/{accountId}/invitations/{id}/cancel(accountId=${session.currentAccount.id}, id=${invitation.id})}" method="post" class="shrink-0">
                    <button type="submit"
                            class="rounded-md bg-white px-2.5 py-1.5 text-sm font-semibold text-gray-900 shadow-xs inset-ring inset-ring-gray-300 hover:bg-gray-50">
                        Cancel
                    </button>
                </form>
            </li>
        </ul>
    </section>
</main>
<div th:replace="~{fragments/notifications :: notifications}"></div>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
