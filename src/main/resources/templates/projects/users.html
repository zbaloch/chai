<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>

<body class="min-h-screen bg-canvas font-sans antialiased">

<nav th:replace="~{fragments/nav :: nav}"></nav>

<main class="mx-auto max-w-4xl px-4 py-8 sm:px-6 lg:px-8">

    <nav th:replace="~{fragments/ui :: breadcrumbs(${project}, null, null)}"></nav>
    <h1 class="mt-2 text-2xl/8 font-bold tracking-tight text-gray-900 sm:text-3xl/9">People</h1>
    <p class="mt-1 text-sm text-gray-500">
        Add or remove people from <span class="font-medium text-gray-700" th:text="${project.name}"></span>.
    </p>

    <div class="mt-6" th:if="${message != null or error != null}">
        <div th:replace="~{fragments/ui :: alerts}"></div>
    </div>

    <ul role="list" class="mt-8 divide-y divide-gray-100 overflow-hidden rounded-xl bg-white shadow-xs ring-1 ring-gray-900/5">
        <li th:each="user : ${users}" class="flex items-center justify-between gap-x-6 px-4 py-4 sm:px-6">
            <div class="flex min-w-0 items-center gap-x-4">
                <img th:replace="~{fragments/ui :: avatar(${user}, 'size-10')}">
                <div class="min-w-0">
                    <p class="text-sm/6 font-semibold text-gray-900" th:text="${user.firstName + ' ' + user.lastName}"></p>
                    <p class="truncate text-xs/5 text-gray-500" th:text="${user.email}"></p>
                </div>
            </div>

            <div class="shrink-0">
                <!-- TODO: Need to validate this on the server side too to avoid having users add themselves -->
                <span th:if="${user.id == session.currentUser.id}"
                      class="inline-flex items-center rounded-md bg-gray-50 px-2 py-1 text-xs font-medium text-gray-600 inset-ring inset-ring-gray-500/10">
                    Owner
                </span>

                <th:block th:if="${user.id != session.currentUser.id}">
                    <form th:if="${user.addedAlready == true}" th:action="@{/project/{id}/users(id=${project.id})}" method="post" class="flex items-center gap-x-3">
                        <span class="hidden items-center rounded-md bg-green-50 px-2 py-1 text-xs font-medium text-green-700 inset-ring inset-ring-green-600/20 sm:inline-flex">Member</span>
                        <input type="hidden" name="action" value="remove"/>
                        <input type="hidden" name="projectId" th:value="${project.id}"/>
                        <input type="hidden" name="userId" th:value="${user.id}"/>
                        <button type="submit"
                                class="rounded-md bg-white px-2.5 py-1.5 text-sm font-semibold text-red-600 shadow-xs inset-ring inset-ring-gray-300 hover:bg-red-50">
                            Remove
                        </button>
                    </form>
                    <form th:if="${user.addedAlready == false}" th:action="@{/project/{id}/users(id=${project.id})}" method="post">
                        <input type="hidden" name="action" value="add"/>
                        <input type="hidden" name="projectId" th:value="${project.id}"/>
                        <input type="hidden" name="userId" th:value="${user.id}"/>
                        <button type="submit"
                                class="rounded-md bg-indigo-600 px-2.5 py-1.5 text-sm font-semibold text-white shadow-xs hover:bg-indigo-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">
                            Add
                        </button>
                    </form>
                </th:block>
            </div>
        </li>
    </ul>

</main>

<div th:replace="~{fragments/notifications :: notifications}"></div>
<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
