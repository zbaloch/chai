<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>

<body class="min-h-screen bg-canvas font-sans antialiased">

<nav th:replace="~{fragments/nav :: nav}"></nav>

<main class="mx-auto max-w-4xl px-4 py-8 sm:px-6 lg:px-8">

    <!-- Company HQ -->
    <section th:if="${not #lists.isEmpty(hqs)}" class="mb-12">
        <h2 class="text-sm font-semibold text-gray-500" th:text="#{company.name}">Company</h2>
        <ul role="list" class="mt-3 grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
            <li th:each="hq : ${hqs}" th:if="${hq.status != 'deleted'}"
                class="group relative flex flex-col rounded-xl bg-white p-6 shadow-xs ring-1 ring-gray-900/5 transition hover:shadow-md hover:ring-gray-900/10">
                <h3 class="text-base font-semibold text-gray-900">
                    <a th:href="@{/project/{id}(id=${hq.id})}" class="focus:outline-none">
                        <span class="absolute inset-0" aria-hidden="true"></span>
                        <span th:text="${hq.name}">HQ</span>
                    </a>
                </h3>
                <p class="mt-1 line-clamp-2 text-sm text-gray-500" th:text="${hq.description}"></p>
                <div class="mt-auto flex -space-x-2 overflow-hidden pt-5">
                    <img th:replace="~{fragments/ui :: avatar(${hq.user}, 'size-7 ring-2 ring-white')}">
                    <th:block th:each="member : ${hq.users}">
                        <img th:replace="~{fragments/ui :: avatar(${member}, 'size-7 ring-2 ring-white')}">
                    </th:block>
                </div>
            </li>
        </ul>
    </section>

    <!-- Projects -->
    <section>
        <div class="flex items-center justify-between gap-x-4">
            <h1 class="text-2xl/8 font-bold tracking-tight text-gray-900">Projects</h1>
            <a th:href="@{/project/new}"
               class="inline-flex items-center gap-x-1.5 rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-xs hover:bg-indigo-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">
                <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="-ml-0.5 size-5">
                    <path d="M10.75 4.75a.75.75 0 0 0-1.5 0v4.5h-4.5a.75.75 0 0 0 0 1.5h4.5v4.5a.75.75 0 0 0 1.5 0v-4.5h4.5a.75.75 0 0 0 0-1.5h-4.5v-4.5Z" />
                </svg>
                New project
            </a>
        </div>

        <ul role="list" class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3"
            th:unless="${#lists.isEmpty(projects)}">
            <li th:each="project : ${projects}" th:if="${project.status != 'deleted'}"
                class="group relative flex flex-col rounded-xl bg-white p-6 shadow-xs ring-1 ring-gray-900/5 transition hover:shadow-md hover:ring-gray-900/10">
                <h3 class="text-base font-semibold text-gray-900">
                    <a th:href="@{/project/{id}(id=${project.id})}" class="focus:outline-none">
                        <span class="absolute inset-0" aria-hidden="true"></span>
                        <span th:text="${project.name}">Project</span>
                    </a>
                </h3>
                <p class="mt-1 line-clamp-2 text-sm text-gray-500" th:text="${project.description}"></p>
                <div class="mt-auto flex -space-x-2 overflow-hidden pt-5">
                    <img th:replace="~{fragments/ui :: avatar(${project.user}, 'size-7 ring-2 ring-white')}">
                    <th:block th:each="member : ${project.users}">
                        <img th:replace="~{fragments/ui :: avatar(${member}, 'size-7 ring-2 ring-white')}">
                    </th:block>
                </div>
            </li>
        </ul>

        <!-- Empty state -->
        <a th:if="${#lists.isEmpty(projects)}" th:href="@{/project/new}"
           class="mt-6 block w-full rounded-xl border-2 border-dashed border-gray-300 p-12 text-center hover:border-gray-400 focus:outline-2 focus:outline-offset-2 focus:outline-indigo-600">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" class="mx-auto size-12 text-gray-400">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12.75V12A2.25 2.25 0 0 1 4.5 9.75h15A2.25 2.25 0 0 1 21.75 12v.75m-8.69-6.44-2.12-2.12a1.5 1.5 0 0 0-1.061-.44H4.5A2.25 2.25 0 0 0 2.25 6v12a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9a2.25 2.25 0 0 0-2.25-2.25h-5.379a1.5 1.5 0 0 1-1.06-.44Z" />
            </svg>
            <span class="mt-2 block text-sm font-semibold text-gray-900">Create your first project</span>
            <span class="mt-1 block text-sm text-gray-500">Projects hold your to-dos, messages and people.</span>
        </a>
    </section>

</main>

<div th:replace="~{fragments/notifications :: notifications}"></div>
<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
