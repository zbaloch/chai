<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>

<body class="min-h-screen bg-canvas font-sans antialiased">

<div th:replace="~{fragments/nav :: nav}"></div>

<main class="mx-auto max-w-4xl px-4 py-8 sm:px-6 lg:px-8">

    <nav th:replace="~{fragments/ui :: breadcrumbs(null, null, null)}"></nav>
    <h1 class="mt-2 text-2xl/8 font-bold tracking-tight text-gray-900 sm:text-3xl/9">Create a new project</h1>
    <p class="mt-1 text-sm text-gray-500">Give it a name and a short description so everyone knows what it's for.</p>

    <form th:action="@{/project/new}" th:object="${project}" method="post"
          class="mt-8 rounded-xl bg-white shadow-xs ring-1 ring-gray-900/5">
        <div class="space-y-8 px-4 py-6 sm:p-8">
            <div class="max-w-2xl">
                <label for="name" class="block text-sm/6 font-medium text-gray-900" th:text="#{project.name.label}">Name</label>
                <div class="mt-2">
                    <input th:field="*{name}" type="text" required autofocus
                           class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6" />
                </div>
                <p class="mt-2 text-sm text-red-600" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
            </div>

            <div class="max-w-2xl">
                <label for="description" class="block text-sm/6 font-medium text-gray-900" th:text="#{project.description.label}">Description</label>
                <div class="mt-2">
                    <textarea th:field="*{description}" rows="3"
                              class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6"></textarea>
                </div>
                <p class="mt-2 text-sm text-red-600" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></p>
            </div>
        </div>

        <div class="flex items-center justify-end gap-x-6 border-t border-gray-900/10 px-4 py-4 sm:px-8">
            <a th:href="@{/projects}" class="text-sm/6 font-semibold text-gray-900">Cancel</a>
            <button type="submit"
                    class="rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-xs hover:bg-indigo-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">
                Create project
            </button>
        </div>
    </form>

</main>

<div th:replace="~{fragments/notifications :: notifications}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
