<!DOCTYPE html>
<html lang="en" class="h-full" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="h-full bg-canvas font-sans antialiased">
<div class="flex min-h-full flex-col justify-center py-12 sm:px-6 lg:px-8">

    <!-- Invalid, used or expired -->
    <th:block th:if="${invitation == null}">
        <div class="sm:mx-auto sm:w-full sm:max-w-md">
            <h2 class="text-center text-2xl/9 font-bold tracking-tight text-gray-900">This invitation has expired</h2>
            <p class="mt-2 text-center text-sm/6 text-gray-500">
                It may have been used already or cancelled. Ask whoever invited you to send a new one, or
                <a th:href="@{/login}" class="font-semibold text-sky-600 hover:text-sky-500">sign in</a>.
            </p>
        </div>
    </th:block>

    <th:block th:if="${invitation != null}">
        <div class="sm:mx-auto sm:w-full sm:max-w-md">
            <h2 class="text-center text-2xl/9 font-bold tracking-tight text-gray-900">
                Join <span th:text="${invitation.account.name}">Company</span>
            </h2>
            <p class="mt-2 text-center text-sm/6 text-gray-500">
                <span th:text="${invitation.invitedBy.firstName + ' ' + invitation.invitedBy.lastName}">Someone</span>
                invited <span class="font-medium text-gray-700" th:text="${invitation.email}"></span> to work together on Chai.
            </p>
        </div>

        <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-[480px]">
            <div th:replace="~{fragments/ui :: alerts}"></div>
            <div class="mt-4 bg-white px-6 py-10 shadow-xs ring-1 ring-gray-900/5 sm:rounded-xl sm:px-12">
                <form method="post" th:action="@{/invitations/{token}(token=${token})}" class="space-y-6">
                    <p th:if="${existingUser != null}" class="text-sm/6 text-gray-700">
                        Welcome back, <span class="font-semibold" th:text="${existingUser.firstName}"></span>.
                        Joining adds <span th:text="${invitation.account.name}"></span> to your accounts.
                    </p>

                    <div th:if="${existingUser == null}" class="grid grid-cols-1 gap-x-4 gap-y-6 sm:grid-cols-2">
                        <div>
                            <label for="firstName" class="block text-sm/6 font-medium text-gray-900">First name</label>
                            <div class="mt-2">
                                <input id="firstName" name="firstName" type="text" autocomplete="given-name" required autofocus
                                       class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-sky-600 sm:text-sm/6">
                            </div>
                        </div>
                        <div>
                            <label for="lastName" class="block text-sm/6 font-medium text-gray-900">Last name</label>
                            <div class="mt-2">
                                <input id="lastName" name="lastName" type="text" autocomplete="family-name" required
                                       class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-sky-600 sm:text-sm/6">
                            </div>
                        </div>
                    </div>

                    <button type="submit"
                            class="flex w-full justify-center rounded-md bg-sky-600 px-3 py-2 text-sm/6 font-semibold text-white shadow-xs hover:bg-sky-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-600">
                        Join <span class="ml-1" th:text="${invitation.account.name}">Company</span>
                    </button>
                </form>
            </div>
        </div>
    </th:block>
</div>
</body>
</html>
