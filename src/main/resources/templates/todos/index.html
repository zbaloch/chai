<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head}"></head>

<body class="min-h-screen bg-canvas font-sans antialiased">

    <div th:replace="~{fragments/nav :: nav}"></div>

    <main class="mx-auto max-w-4xl px-4 py-8 sm:px-6 lg:px-8" th:with="today=${#dates.createToday()}">

        <nav th:replace="~{fragments/ui :: breadcrumbs(${project}, null, null)}"></nav>
        <h1 class="mt-2 text-2xl/8 font-bold tracking-tight text-gray-900 sm:text-3xl/9">To-dos</h1>
        <p class="mt-1 text-sm text-gray-500">Make lists of work that needs to get done, assign items, set due dates, and discuss.</p>

        <!-- Pending -->
        <div class="mt-8 overflow-hidden rounded-xl bg-white shadow-xs ring-1 ring-gray-900/5">
            <ul id="pending-todos-list" th:data-project-id="${project.id}" role="list" class="divide-y divide-gray-100">
                <th:block th:each="todo : ${pendingTodos}">
                    <li th:data-id="${todo.id}" draggable="true"
                        class="todo-item group relative flex cursor-grab items-center gap-x-3 py-3 pr-4 pl-2 hover:bg-gray-50 sm:pr-6">
                        <span class="drag-handle flex shrink-0 items-center text-gray-300 opacity-0 transition-opacity group-hover:opacity-100" aria-hidden="true">
                            <svg viewBox="0 0 20 20" fill="currentColor" class="size-5">
                                <circle cx="7" cy="4" r="1.5" /><circle cx="13" cy="4" r="1.5" /><circle cx="7" cy="10" r="1.5" /><circle cx="13" cy="10" r="1.5" /><circle cx="7" cy="16" r="1.5" /><circle cx="13" cy="16" r="1.5" />
                            </svg>
                        </span>

                        <span class="size-4 shrink-0 rounded-full border-2 border-gray-300" aria-hidden="true"></span>

                        <div class="min-w-0 flex-auto">
                            <a th:href="@{/project/{projectId}/todo/{todoId}(projectId=${project.id}, todoId=${todo.id})}"
                               draggable="false" class="text-sm/6 font-medium text-gray-900">
                                <span class="absolute inset-0" aria-hidden="true"></span>
                                <span th:text="${todo.description}">To-do</span>
                            </a>
                        </div>

                        <div class="flex shrink-0 items-center gap-x-4 text-xs/5 text-gray-500">
                            <span th:if="${todo.comments != null and #lists.size(todo.comments) > 0}"
                                  class="hidden items-center gap-x-1 sm:inline-flex"
                                  th:title="${#lists.size(todo.comments) + ' comments'}">
                                <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="size-4 text-gray-400">
                                    <path fill-rule="evenodd" d="M10 2c-2.236 0-4.43.18-6.57.524C1.993 2.755 1 4.014 1 5.426v5.148c0 1.413.993 2.67 2.43 2.902.848.137 1.705.248 2.57.331v3.443a.75.75 0 0 0 1.28.53l3.58-3.579a.78.78 0 0 1 .527-.224 41.202 41.202 0 0 0 5.183-.5c1.437-.232 2.43-1.49 2.43-2.903V5.426c0-1.413-.993-2.67-2.43-2.902A41.289 41.289 0 0 0 10 2Z" clip-rule="evenodd" />
                                </svg>
                                <span th:text="${#lists.size(todo.comments)}"></span>
                            </span>

                            <span th:if="${todo.dueDate != null}"
                                  class="inline-flex items-center gap-x-1 rounded-md px-1.5 py-0.5 font-medium"
                                  th:classappend="${todo.dueDate.timeInMillis < today.time} ? 'bg-red-50 text-red-700' : 'text-gray-500'">
                                <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="size-4 opacity-60">
                                    <path fill-rule="evenodd" d="M5.75 2a.75.75 0 0 1 .75.75V4h7V2.75a.75.75 0 0 1 1.5 0V4h.25A2.75 2.75 0 0 1 18 6.75v8.5A2.75 2.75 0 0 1 15.25 18H4.75A2.75 2.75 0 0 1 2 15.25v-8.5A2.75 2.75 0 0 1 4.75 4H5V2.75A.75.75 0 0 1 5.75 2Zm-1 5.5c-.69 0-1.25.56-1.25 1.25v6.5c0 .69.56 1.25 1.25 1.25h10.5c.69 0 1.25-.56 1.25-1.25v-6.5c0-.69-.56-1.25-1.25-1.25H4.75Z" clip-rule="evenodd" />
                                </svg>
                                <span th:text="${#dates.format(todo.dueDate.time, 'MMM d')}"></span>
                            </span>

                            <span th:if="${todo.assignedTo != null}" class="inline-flex items-center gap-x-1.5">
                                <img th:replace="~{fragments/ui :: avatar(${todo.assignedTo}, 'size-5')}">
                                <span class="hidden sm:inline"
                                      th:text="${todo.assignedTo.firstName + ' ' + todo.assignedTo.lastName.charAt(0) + '.'}"></span>
                            </span>
                            <span th:if="${todo.assignedTo == null}" class="italic">Unassigned</span>
                        </div>
                    </li>
                </th:block>
            </ul>

            <p th:if="${#lists.isEmpty(pendingTodos)}" class="px-6 py-10 text-center text-sm text-gray-500">
                Nothing left to do. Nice work!
            </p>

            <a th:href="@{/project/{id}/todo/new(id=${project.id})}"
               class="flex items-center gap-x-2 border-t border-gray-100 px-4 py-3 text-sm font-medium text-indigo-600 hover:bg-gray-50 hover:text-indigo-500 sm:px-6">
                <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="size-5">
                    <path d="M10.75 4.75a.75.75 0 0 0-1.5 0v4.5h-4.5a.75.75 0 0 0 0 1.5h4.5v4.5a.75.75 0 0 0 1.5 0v-4.5h4.5a.75.75 0 0 0 0-1.5h-4.5v-4.5Z" />
                </svg>
                Add a to-do
            </a>
        </div>

        <!-- Completed -->
        <section th:if="${completedTodos != null and !completedTodos.isEmpty()}" class="mt-10">
            <h2 class="text-sm font-semibold text-gray-500">
                Completed <span class="font-normal" th:text="'(' + ${#lists.size(completedTodos)} + ')'"></span>
            </h2>
            <ul role="list" class="mt-3 divide-y divide-gray-100 overflow-hidden rounded-xl bg-white/60 ring-1 ring-gray-900/5">
                <li th:each="todo : ${completedTodos}" class="relative flex items-center gap-x-3 px-4 py-3 hover:bg-white sm:px-6">
                    <span class="flex size-4 shrink-0 items-center justify-center rounded-full bg-green-500 text-white" aria-hidden="true">
                        <svg viewBox="0 0 20 20" fill="currentColor" class="size-3">
                            <path fill-rule="evenodd" d="M16.704 4.153a.75.75 0 0 1 .143 1.052l-8 10.5a.75.75 0 0 1-1.127.075l-4.5-4.5a.75.75 0 0 1 1.06-1.06l3.894 3.893 7.48-9.817a.75.75 0 0 1 1.05-.143Z" clip-rule="evenodd" />
                        </svg>
                    </span>
                    <div class="min-w-0 flex-auto">
                        <a th:href="@{/project/{projectId}/todo/{todoId}(projectId=${project.id}, todoId=${todo.id})}"
                           class="text-sm/6 text-gray-500 line-through decoration-gray-300">
                            <span class="absolute inset-0" aria-hidden="true"></span>
                            <span th:text="${todo.description}">To-do</span>
                        </a>
                    </div>
                    <div class="flex shrink-0 items-center gap-x-4 text-xs/5 text-gray-400">
                        <span th:if="${todo.comments != null and #lists.size(todo.comments) > 0}"
                              class="hidden items-center gap-x-1 sm:inline-flex">
                            <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="size-4">
                                <path fill-rule="evenodd" d="M10 2c-2.236 0-4.43.18-6.57.524C1.993 2.755 1 4.014 1 5.426v5.148c0 1.413.993 2.67 2.43 2.902.848.137 1.705.248 2.57.331v3.443a.75.75 0 0 0 1.28.53l3.58-3.579a.78.78 0 0 1 .527-.224 41.202 41.202 0 0 0 5.183-.5c1.437-.232 2.43-1.49 2.43-2.903V5.426c0-1.413-.993-2.67-2.43-2.902A41.289 41.289 0 0 0 10 2Z" clip-rule="evenodd" />
                            </svg>
                            <span th:text="${#lists.size(todo.comments)}"></span>
                        </span>
                        <span th:if="${todo.assignedTo != null}" class="inline-flex items-center gap-x-1.5">
                            <img th:replace="~{fragments/ui :: avatar(${todo.assignedTo}, 'size-5 opacity-70')}">
                            <span class="hidden sm:inline"
                                  th:text="${todo.assignedTo.firstName + ' ' + todo.assignedTo.lastName.charAt(0) + '.'}"></span>
                        </span>
                    </div>
                </li>
            </ul>
        </section>

    </main>


    <div th:replace="~{fragments/notifications :: notifications}"></div>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script>
        (function () {
            const list = document.getElementById('pending-todos-list');
            if (!list) {
                return;
            }

            const projectId = list.dataset.projectId;
            let draggedItem = null;
            let didDrag = false;

            function getTodoItems() {
                return Array.from(list.querySelectorAll('.todo-item'));
            }

            function getTodoIds() {
                return getTodoItems().map(item => Number(item.dataset.id));
            }

            async function persistOrder() {
                const payload = getTodoIds();
                if (!projectId || payload.length === 0) {
                    return;
                }

                try {
                    const response = await fetch(`/project/${projectId}/todos/reorder`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        console.error('Failed to persist todo order:', response.status);
                    }
                } catch (error) {
                    console.error('Failed to persist todo order:', error);
                }
            }

            function handleDragOver(event) {
                event.preventDefault();

                const afterElement = getDragAfterElement(event.clientY);
                if (!draggedItem) {
                    return;
                }

                if (afterElement == null) {
                    list.appendChild(draggedItem);
                } else {
                    list.insertBefore(draggedItem, afterElement);
                }
            }

            function getDragAfterElement(y) {
                const draggableElements = getTodoItems().filter(item => item !== draggedItem);

                return draggableElements.reduce((closest, child) => {
                    const box = child.getBoundingClientRect();
                    const offset = y - box.top - box.height / 2;

                    if (offset < 0 && offset > closest.offset) {
                        return { offset: offset, element: child };
                    }

                    return closest;
                }, { offset: Number.NEGATIVE_INFINITY, element: null }).element;
            }

            getTodoItems().forEach(item => {
                item.addEventListener('dragstart', () => {
                    draggedItem = item;
                    didDrag = false;
                    item.classList.add('opacity-50');
                });

                item.addEventListener('drag', () => {
                    didDrag = true;
                });

                item.addEventListener('dragend', async () => {
                    item.classList.remove('opacity-50');
                    draggedItem = null;
                    await persistOrder();

                    setTimeout(() => {
                        didDrag = false;
                    }, 0);
                });

                const link = item.querySelector('a');
                if (link) {
                    link.addEventListener('click', (event) => {
                        if (didDrag) {
                            event.preventDefault();
                            event.stopPropagation();
                        }
                    });
                }
            });

            list.addEventListener('dragover', handleDragOver);
        })();
    </script>

</body>

</html>
