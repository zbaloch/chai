<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>

<body class="min-h-screen bg-canvas font-sans antialiased">

<div th:replace="~{fragments/nav :: nav}"></div>

<main class="mx-auto max-w-4xl px-4 py-8 sm:px-6 lg:px-8">

    <nav th:replace="~{fragments/ui :: breadcrumbs(${project}, 'To-dos', @{/project/{id}/todos(id=${project.id})})}"></nav>
    <h1 class="mt-2 text-2xl/8 font-bold tracking-tight text-gray-900 sm:text-3xl/9">Edit to-do</h1>

    <form th:action="@{/project/{projectId}/todo/{todoId}/edit(projectId=${project.id}, todoId=${todo.id})}" th:object="${todo}" method="post"
          class="mt-8 rounded-xl bg-white shadow-xs ring-1 ring-gray-900/5">
        <div class="grid grid-cols-1 gap-x-6 gap-y-8 px-4 py-6 sm:grid-cols-6 sm:p-8">

            <div class="sm:col-span-6">
                <label for="description" class="block text-sm/6 font-medium text-gray-900">Description</label>
                <div class="mt-2">
                    <input th:field="*{description}" type="text" placeholder="What needs to get done?"
                           class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-sky-600 sm:text-sm/6">
                </div>
                <p class="mt-2 text-sm text-red-600" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></p>
            </div>

            <div class="sm:col-span-3">
                <label for="assignedToVariable" class="block text-sm/6 font-medium text-gray-900">Assigned to</label>
                <div class="mt-2 grid grid-cols-1">
                    <select th:field="*{assignedToVariable}"
                            class="col-start-1 row-start-1 w-full appearance-none rounded-md bg-white py-1.5 pr-8 pl-3 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 focus:outline-2 focus:-outline-offset-2 focus:outline-sky-600 sm:text-sm/6">
                        <option th:each="user : ${project.users}"
                                th:value="${user.id}"
                                th:text="${user.firstName + ' ' + user.lastName}"
                                th:selected="${todo.assignedTo.id == user.id}">User Name</option>
                        <option th:value="${session.currentUser.id}"
                                th:text="${session.currentUser.firstName + ' ' + session.currentUser.lastName}"
                                th:selected="${todo.assignedTo.id == session.currentUser.id}">Current User</option>
                    </select>
                    <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" class="pointer-events-none col-start-1 row-start-1 mr-2 size-5 self-center justify-self-end text-gray-500 sm:size-4">
                        <path fill-rule="evenodd" d="M4.22 6.22a.75.75 0 0 1 1.06 0L8 8.94l2.72-2.72a.75.75 0 1 1 1.06 1.06l-3.25 3.25a.75.75 0 0 1-1.06 0L4.22 7.28a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd" />
                    </svg>
                </div>
            </div>

            <div class="sm:col-span-3">
                <label for="dueDateVariable" class="block text-sm/6 font-medium text-gray-900">Due on</label>
                <div class="mt-2">
                    <input type="date" id="dueDateVariable" name="dueDateVariable"
                           th:value="${#dates.format(todo.dueDate.time, 'yyyy-MM-dd')}"
                           class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 focus:outline-2 focus:-outline-offset-2 focus:outline-sky-600 sm:text-sm/6">
                </div>
            </div>

            <div class="sm:col-span-6">
                <label for="todo-notes" class="block text-sm/6 font-medium text-gray-900">
                    Notes <span class="font-normal text-gray-500">(optional)</span>
                </label>
                <div class="mt-2">
                    <lexxy-editor name="notes" th:value="*{notes}" class="lexxy-content editor-notes"></lexxy-editor>
                </div>
            </div>

        </div>

        <div class="flex items-center justify-between gap-x-6 border-t border-gray-900/10 px-4 py-4 sm:px-8">
            <button type="button" command="show-modal" commandfor="delete-todo"
                    class="text-sm/6 font-semibold text-red-600 hover:text-red-500">
                Delete
            </button>
            <div class="flex items-center gap-x-6">
                <a th:href="@{/project/{projectId}/todo/{todoId}(projectId=${project.id}, todoId=${todo.id})}" class="text-sm/6 font-semibold text-gray-900">Cancel</a>
                <button type="submit"
                        class="rounded-md bg-sky-600 px-3 py-2 text-sm font-semibold text-white shadow-xs hover:bg-sky-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-600">
                    Save changes
                </button>
            </div>
        </div>
    </form>

    <el-dialog th:replace="~{fragments/ui :: confirmDialog('delete-todo', 'Delete to-do', 'This to-do and its comments will be deleted. This can’t be undone.', @{/project/{projectId}/todo/{todoId}/delete(projectId=${project.id}, todoId=${todo.id})}, 'Delete to-do')}"></el-dialog>

</main>

<div th:replace="~{fragments/notifications :: notifications}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
