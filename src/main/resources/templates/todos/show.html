<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>

<body class="min-h-screen bg-canvas font-sans antialiased">

<div th:replace="~{fragments/nav :: nav}"></div>

<main class="mx-auto max-w-4xl px-4 py-8 sm:px-6 lg:px-8"
      th:with="isCreator=${todo.createdBy != null and currentUser != null and todo.createdBy.id == currentUser.id}">

    <nav th:replace="~{fragments/ui :: breadcrumbs(${project}, 'To-dos', @{/project/{id}/todos(id=${project.id})})}"></nav>

    <!-- To-do -->
    <article class="mt-4 rounded-xl bg-white shadow-xs ring-1 ring-gray-900/5">
        <header class="border-b border-gray-900/5 px-4 py-6 sm:px-8">
            <div class="flex flex-wrap items-start justify-between gap-4">
                <div class="min-w-0">
                    <div class="flex items-center gap-x-3">
                        <h1 class="text-2xl/8 font-bold tracking-tight text-gray-900"
                            th:classappend="${todo.done == true} ? 'text-gray-500 line-through decoration-gray-300'"
                            th:text="${todo.description}">To-do</h1>
                        <span th:if="${todo.done == true}"
                              class="inline-flex shrink-0 items-center rounded-md bg-green-50 px-2 py-1 text-xs font-medium text-green-700 inset-ring inset-ring-green-600/20">Done</span>
                    </div>
                    <p class="mt-1 text-sm text-gray-500">
                        Added by <span th:text="${todo.createdBy.firstName + ' ' + todo.createdBy.lastName.charAt(0) + '.'}"></span>
                        on <span th:text="${#dates.format(todo.createdAt.time, 'MMM d, yyyy')}"></span>
                    </p>
                </div>

                <div th:if="${isCreator}" class="flex shrink-0 items-center gap-x-3">
                    <a th:href="@{/project/{projectId}/todo/{todoId}/edit(projectId=${project.id}, todoId=${todo.id})}"
                       class="rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 shadow-xs inset-ring inset-ring-gray-300 hover:bg-gray-50">
                        Edit
                    </a>
                    <a th:if="${todo.done != true}"
                       th:href="@{/project/{projectId}/todo/{todoId}/complete(projectId=${project.id}, todoId=${todo.id})}"
                       class="inline-flex items-center gap-x-1.5 rounded-md bg-green-600 px-3 py-2 text-sm font-semibold text-white shadow-xs hover:bg-green-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-green-600">
                        <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="-ml-0.5 size-5">
                            <path fill-rule="evenodd" d="M16.704 4.153a.75.75 0 0 1 .143 1.052l-8 10.5a.75.75 0 0 1-1.127.075l-4.5-4.5a.75.75 0 0 1 1.06-1.06l3.894 3.893 7.48-9.817a.75.75 0 0 1 1.05-.143Z" clip-rule="evenodd" />
                        </svg>
                        Mark complete
                    </a>
                </div>
            </div>
        </header>

        <dl class="grid grid-cols-1 gap-x-6 gap-y-6 px-4 py-6 sm:grid-cols-2 sm:px-8">
            <div>
                <dt class="text-sm/6 font-medium text-gray-500">Assigned to</dt>
                <dd class="mt-1 flex items-center gap-x-2 text-sm/6 text-gray-900">
                    <th:block th:if="${todo.assignedTo != null}">
                        <img th:replace="~{fragments/ui :: avatar(${todo.assignedTo}, 'size-6')}">
                        <span th:text="${todo.assignedTo.firstName + ' ' + todo.assignedTo.lastName.charAt(0) + '.'}"></span>
                    </th:block>
                    <span th:if="${todo.assignedTo == null}" class="text-gray-500">Unassigned</span>
                </dd>
            </div>
            <div>
                <dt class="text-sm/6 font-medium text-gray-500">Due on</dt>
                <dd class="mt-1 flex items-center gap-x-2 text-sm/6 text-gray-900">
                    <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="size-5 text-gray-400">
                        <path fill-rule="evenodd" d="M5.75 2a.75.75 0 0 1 .75.75V4h7V2.75a.75.75 0 0 1 1.5 0V4h.25A2.75 2.75 0 0 1 18 6.75v8.5A2.75 2.75 0 0 1 15.25 18H4.75A2.75 2.75 0 0 1 2 15.25v-8.5A2.75 2.75 0 0 1 4.75 4H5V2.75A.75.75 0 0 1 5.75 2Zm-1 5.5c-.69 0-1.25.56-1.25 1.25v6.5c0 .69.56 1.25 1.25 1.25h10.5c.69 0 1.25-.56 1.25-1.25v-6.5c0-.69-.56-1.25-1.25-1.25H4.75Z" clip-rule="evenodd" />
                    </svg>
                    <span th:if="${todo.dueDate == null}" class="text-gray-500">No due date</span>
                    <span th:if="${todo.dueDate != null}" th:text="${#dates.format(todo.dueDate.time, 'MMM d, yyyy')}"></span>
                </dd>
            </div>
            <div class="sm:col-span-2">
                <dt class="text-sm/6 font-medium text-gray-500">Notes</dt>
                <dd th:if="${todo.notes != null and !#strings.isEmpty(todo.notes)}"
                    class="lexxy-content mt-1 text-sm/6 text-gray-900" th:utext="${todo.notes}"></dd>
                <dd th:unless="${todo.notes != null and !#strings.isEmpty(todo.notes)}"
                    class="mt-1 text-sm/6 text-gray-500">No notes here.</dd>
            </div>
        </dl>
    </article>

    <!-- Comments -->
    <section aria-labelledby="comments-heading" class="mt-10">
        <h2 id="comments-heading" class="flex items-center gap-x-2 text-base font-semibold text-gray-900">
            Comments
            <span class="inline-flex items-center rounded-full bg-gray-900/5 px-2 py-0.5 text-xs font-medium text-gray-600"
                  th:text="${todo.comments.size()}">0</span>
        </h2>

        <ul role="list" class="mt-6 space-y-6">
            <li th:each="comment : ${todo.comments}" th:id="'comment_' + ${comment.id}" class="flex gap-x-4">
                <img th:replace="~{fragments/ui :: avatar(${comment.user}, 'size-10')}">
                <div class="min-w-0 flex-auto rounded-xl bg-white p-4 shadow-xs ring-1 ring-gray-900/5">
                    <div class="flex items-start justify-between gap-x-4">
                        <p class="text-sm/6">
                            <span class="font-semibold text-gray-900" th:text="${comment.user.firstName + ' ' + comment.user.lastName}"></span>
                            <span class="ml-1 text-gray-500">
                                <span th:text="${#dates.format(comment.createdAt.time, 'MMM d, yyyy')}"></span>
                                at <span th:text="${#dates.format(comment.createdAt.time, 'h:mm a')}"></span>
                            </span>
                        </p>
                        <form th:if="${session.currentUser != null and session.currentUser.id == comment.user.id}"
                              th:action="@{/project/{projectId}/todo/{todoId}/comment/{commentId}/delete(projectId=${project.id}, todoId=${todo.id}, commentId=${comment.id})}"
                              method="post" onsubmit="return confirm('Delete this comment?')">
                            <button type="submit" class="-m-1.5 shrink-0 rounded-md p-1.5 text-gray-400 hover:bg-red-50 hover:text-red-600">
                                <span class="sr-only">Delete comment</span>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="size-4">
                                    <path d="M10 11v6" />
                                    <path d="M14 11v6" />
                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
                                    <path d="M3 6h18" />
                                    <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                                </svg>
                            </button>
                        </form>
                    </div>
                    <div class="lexxy-content mt-1 text-sm/6 text-gray-700" th:utext="${comment.text}"></div>
                </div>
            </li>
        </ul>

        <!-- New comment -->
        <div id="comment_form" class="mt-8 flex gap-x-4">
            <th:block th:if="${currentUser != null}">
                <img th:replace="~{fragments/ui :: avatar(${currentUser}, 'size-10')}">
            </th:block>
            <form method="post" class="min-w-0 flex-auto"
                  th:action="@{/project/{projectId}/todo/{todoId}/comment(projectId=${project.id}, todoId=${todo.id})}">
                <lexxy-editor name="text" class="lexxy-content editor-comment" placeholder="Add a comment…"></lexxy-editor>
                <div class="mt-3 flex justify-end">
                    <button type="submit"
                            class="rounded-md bg-sky-600 px-3 py-2 text-sm font-semibold text-white shadow-xs hover:bg-sky-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-600">
                        Add comment
                    </button>
                </div>
            </form>
        </div>
    </section>

</main>

<div th:replace="~{fragments/notifications :: notifications}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
