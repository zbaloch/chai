<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>

<body class="min-h-screen bg-canvas font-sans antialiased">

<nav th:replace="~{fragments/nav :: nav}"></nav>

<main class="mx-auto max-w-4xl px-4 py-8 sm:px-6 lg:px-8">

    <nav th:replace="~{fragments/ui :: breadcrumbs(null, null, null)}"></nav>
    <h1 class="mt-2 text-2xl/8 font-bold tracking-tight text-gray-900 sm:text-3xl/9">Edit time entry</h1>

    <form th:object="${timesheet}" th:action="@{/timesheet/{id}/edit(id=${timesheet.id})}" method="post"
          class="mt-8 rounded-xl bg-white shadow-xs ring-1 ring-gray-900/5">
        <div class="grid grid-cols-1 gap-x-6 gap-y-8 px-4 py-6 sm:grid-cols-6 sm:p-8">

            <div class="sm:col-span-3">
                <label for="task" class="block text-sm/6 font-medium text-gray-900">Task</label>
                <div class="mt-2">
                    <input th:field="*{task}" type="text"
                           class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-sky-600 sm:text-sm/6" />
                </div>
                <p class="mt-2 text-sm text-red-600" th:if="${#fields.hasErrors('task')}" th:errors="*{task}"></p>
            </div>

            <div class="sm:col-span-3">
                <label for="timeLogDate" class="block text-sm/6 font-medium text-gray-900">Date</label>
                <div class="mt-2">
                    <input type="date" id="timeLogDate" name="timeLogDate"
                           th:value="${timesheet.timeLogDate != null ? #dates.format(timesheet.timeLogDate, 'yyyy-MM-dd') : ''}"
                           class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-sky-600 sm:text-sm/6">
                </div>
                <p class="mt-2 text-sm text-red-600" th:if="${#fields.hasErrors('timeLogDate')}" th:errors="*{timeLogDate}"></p>
            </div>

            <div class="sm:col-span-3">
                <label for="projectId" class="block text-sm/6 font-medium text-gray-900">Project</label>
                <div class="mt-2 grid grid-cols-1">
                    <select id="projectId" name="projectId"
                            class="col-start-1 row-start-1 w-full appearance-none rounded-md bg-white py-1.5 pr-8 pl-3 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 focus:outline-2 focus:-outline-offset-2 focus:outline-sky-600 sm:text-sm/6">
                        <option th:each="project : ${projects}" th:value="${project.id}" th:text="${project.name}"
                                th:selected="${timesheet.project != null and project.id == timesheet.project.id}"></option>
                    </select>
                    <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" class="pointer-events-none col-start-1 row-start-1 mr-2 size-5 self-center justify-self-end text-gray-500 sm:size-4">
                        <path fill-rule="evenodd" d="M4.22 6.22a.75.75 0 0 1 1.06 0L8 8.94l2.72-2.72a.75.75 0 1 1 1.06 1.06l-3.25 3.25a.75.75 0 0 1-1.06 0L4.22 7.28a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd" />
                    </svg>
                </div>
            </div>

            <div class="sm:col-span-3">
                <label for="manHours" class="block text-sm/6 font-medium text-gray-900">Time spent</label>
                <div class="mt-2 flex items-center rounded-md bg-white pr-3 outline-1 -outline-offset-1 outline-gray-300 has-[input:focus-within]:outline-2 has-[input:focus-within]:-outline-offset-2 has-[input:focus-within]:outline-sky-600">
                    <input th:field="*{manHours}" type="text" inputmode="decimal"
                           class="block min-w-0 grow bg-white py-1.5 pl-3 text-base text-gray-900 placeholder:text-gray-400 focus:outline-none sm:text-sm/6" />
                    <span class="shrink-0 text-base text-gray-500 select-none sm:text-sm/6">hours</span>
                </div>
                <p class="mt-2 text-sm text-red-600" th:if="${#fields.hasErrors('manHours')}" th:errors="*{manHours}"></p>
            </div>

            <div class="sm:col-span-6">
                <label for="notes" class="block text-sm/6 font-medium text-gray-900">
                    Notes <span class="font-normal text-gray-500">(supports markdown)</span>
                </label>
                <div class="mt-2">
                    <textarea th:field="*{notes}" rows="4"
                              class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-sky-600 sm:text-sm/6"></textarea>
                </div>
                <p class="mt-2 text-sm text-red-600" th:if="${#fields.hasErrors('notes')}" th:errors="*{notes}"></p>
            </div>

        </div>

        <div class="flex items-center justify-end gap-x-6 border-t border-gray-900/10 px-4 py-4 sm:px-8">
            <a th:href="@{/projects}" class="text-sm/6 font-semibold text-gray-900">Cancel</a>
            <button type="submit"
                    class="rounded-md bg-sky-600 px-3 py-2 text-sm font-semibold text-white shadow-xs hover:bg-sky-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-600">
                Save changes
            </button>
        </div>
    </form>

</main>

<div th:replace="~{fragments/notifications :: notifications}"></div>
<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
