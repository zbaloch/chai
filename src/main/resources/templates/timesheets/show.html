<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>

<body class="min-h-screen bg-canvas font-sans antialiased">

<nav th:replace="~{fragments/nav :: nav}"></nav>

<main class="mx-auto max-w-4xl px-4 py-8 sm:px-6 lg:px-8"
      th:with="isOwner=${project.user != null and session.currentUser != null and project.user.id == session.currentUser.id}">

    <!-- Page header -->
    <nav th:replace="~{fragments/ui :: breadcrumbs(null, null, null)}"></nav>
    <div class="mt-2 flex items-start justify-between gap-x-4">
        <div class="min-w-0">
            <h1 class="text-2xl/8 font-bold tracking-tight text-gray-900 sm:truncate sm:text-3xl/9" th:text="${project.name}">Project</h1>
            <p class="mt-1 text-sm text-gray-500" th:text="${project.description}"></p>
        </div>

        <el-dropdown th:if="${isOwner and project.projectType != 'hq'}" class="relative shrink-0">
            <button class="flex items-center rounded-full p-1.5 text-gray-400 hover:bg-gray-900/5 hover:text-gray-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-600">
                <span class="sr-only">Project options</span>
                <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="size-5">
                    <path d="M10 3a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3ZM10 8.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3ZM11.5 15.5a1.5 1.5 0 1 0-3 0 1.5 1.5 0 0 0 3 0Z" />
                </svg>
            </button>
            <el-menu anchor="bottom end" popover
                     class="w-40 origin-top-right rounded-md bg-white py-1 shadow-lg outline-1 outline-black/5 transition transition-discrete [--anchor-gap:--spacing(2)] data-closed:scale-95 data-closed:transform data-closed:opacity-0 data-enter:duration-100 data-enter:ease-out data-leave:duration-75 data-leave:ease-in">
                <a th:href="@{/project/{id}/edit(id=${project.id})}"
                   class="block px-4 py-2 text-sm text-gray-700 focus:bg-gray-100 focus:text-gray-900 focus:outline-hidden">Edit project</a>
                <button type="button" command="show-modal" commandfor="delete-project"
                        class="block w-full px-4 py-2 text-left text-sm text-red-600 focus:bg-red-50 focus:outline-hidden">Delete project</button>
            </el-menu>
        </el-dropdown>
    </div>

    <!-- People -->
    <div class="mt-6 flex flex-wrap items-center gap-x-4 gap-y-3">
        <div class="flex -space-x-2 overflow-hidden">
            <img th:replace="~{fragments/ui :: avatar(${project.user}, 'size-8 ring-2 ring-canvas')}">
            <th:block th:each="member : ${project.users}">
                <img th:replace="~{fragments/ui :: avatar(${member}, 'size-8 ring-2 ring-canvas')}">
            </th:block>
        </div>
        <a th:if="${isOwner}" th:href="@{/project/{id}/users(id=${project.id})}"
           class="inline-flex items-center gap-x-1.5 rounded-full bg-white px-3 py-1.5 text-xs font-semibold text-gray-700 shadow-xs inset-ring inset-ring-gray-300 hover:bg-gray-50">
            <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="-ml-0.5 size-4 text-gray-400">
                <path d="M10.75 4.75a.75.75 0 0 0-1.5 0v4.5h-4.5a.75.75 0 0 0 0 1.5h4.5v4.5a.75.75 0 0 0 1.5 0v-4.5h4.5a.75.75 0 0 0 0-1.5h-4.5v-4.5Z" />
            </svg>
            Add / remove people
        </a>
    </div>

    <!-- Tools -->
    <ul role="list" class="mt-10 grid grid-cols-1 gap-4 sm:grid-cols-2">
        <li class="group relative rounded-xl bg-white p-6 shadow-xs ring-1 ring-gray-900/5 transition hover:shadow-md hover:ring-gray-900/10">
            <h3 class="text-base font-semibold text-gray-900">
                <a th:href="@{/project/{id}/todos(id=${project.id})}" class="focus:outline-none">
                    <span class="absolute inset-0" aria-hidden="true"></span>
                    To-dos
                </a>
            </h3>
            <p class="mt-1 text-sm text-gray-500">Make lists of work that needs to get done, assign items, set due dates, and discuss.</p>
        </li>

        <li class="group relative rounded-xl bg-white p-6 shadow-xs ring-1 ring-gray-900/5 transition hover:shadow-md hover:ring-gray-900/10">
            <h3 class="text-base font-semibold text-gray-900">
                <a th:href="@{/project/{id}/messages(id=${project.id})}" class="focus:outline-none">
                    <span class="absolute inset-0" aria-hidden="true"></span>
                    Messages
                </a>
            </h3>
            <p class="mt-1 text-sm text-gray-500">Communicate, make decisions and post updates in one place.</p>
        </li>
        <li class="group relative rounded-xl bg-white p-6 shadow-xs ring-1 ring-gray-900/5 transition hover:shadow-md hover:ring-gray-900/10">
            <h3 class="text-base font-semibold text-gray-900">
                <a th:href="@{/project/{id}/files(id=${project.id})}" class="focus:outline-none">
                    <span class="absolute inset-0" aria-hidden="true"></span>
                    Docs &amp; Files
                </a>
            </h3>
            <p class="mt-1 text-sm text-gray-500">A place to store and organize assets and files.</p>
        </li>
    </ul>

    <th:block th:if="${isOwner and project.projectType != 'hq'}">
        <el-dialog th:replace="~{fragments/ui :: confirmDialog('delete-project', 'Delete project', 'This project and everything in it will be deleted. This can’t be undone.', @{/project/{id}/delete(id=${project.id})}, 'Delete project')}"></el-dialog>
    </th:block>

</main>

<div th:replace="~{fragments/notifications :: notifications}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
