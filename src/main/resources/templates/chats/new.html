<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>

<body class="min-h-screen bg-canvas font-sans antialiased">

<nav th:replace="~{fragments/nav :: nav}"></nav>

<main class="mx-auto max-w-5xl px-4 py-8 sm:px-6 lg:px-8">

    <nav th:replace="~{fragments/ui :: breadcrumbs(null, 'Chats', @{/{a}/chats(a=${account.id})})}"></nav>
    <h1 class="mt-2 text-2xl/8 font-bold tracking-tight text-gray-900 sm:text-3xl/9">New chat</h1>
    <p class="mt-1 text-sm text-gray-500">Pick one person, or a few for a group chat.</p>

    <form th:if="${not #lists.isEmpty(people)}" th:action="@{/{a}/chats(a=${account.id})}" method="post" class="mt-8">
        <label for="people-filter" class="sr-only">Find someone</label>
        <input id="people-filter" type="search" placeholder="Find someone…" autocomplete="off"
               class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-sky-600 sm:max-w-xs sm:text-sm/6"/>

        <ul role="list" class="mt-4 divide-y divide-gray-100 overflow-hidden rounded-xl bg-white shadow-xs ring-1 ring-gray-900/5">
            <li th:each="person : ${people}"
                th:attr="data-person-name=${#strings.toLowerCase(person.firstName + ' ' + person.lastName + ' ' + person.email)}">
                <label class="flex cursor-pointer items-center gap-x-4 px-4 py-3 hover:bg-gray-50 sm:px-6">
                    <input type="checkbox" name="people" th:value="${person.id}" class="size-4 shrink-0 accent-sky-600"/>
                    <img th:replace="~{fragments/ui :: avatar(${person}, 'size-8')}">
                    <span class="min-w-0">
                        <span class="block text-sm/6 font-semibold text-gray-900" th:text="${person.firstName + ' ' + person.lastName}"></span>
                        <span class="block truncate text-xs/5 text-gray-500" th:text="${person.email}"></span>
                    </span>
                </label>
            </li>
        </ul>

        <div class="mt-6 flex items-center gap-x-4">
            <button type="submit"
                    class="rounded-md bg-sky-600 px-3 py-2 text-sm font-semibold text-white shadow-xs hover:bg-sky-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-600">
                Start chat
            </button>
            <a th:href="@{/{a}/chats(a=${account.id})}" class="text-sm font-semibold text-gray-900">Cancel</a>
        </div>
    </form>

    <div th:if="${#lists.isEmpty(people)}" class="mt-8 rounded-xl border-2 border-dashed border-gray-300 p-12 text-center">
        <p class="text-sm font-semibold text-gray-900" th:text="'There’s no one else in ' + ${account.name} + ' yet'"></p>
        <p class="mt-1 text-sm text-gray-500">
            Invite people from <a th:href="@{/{a}/people(a=${account.id})}" class="font-semibold text-sky-600 hover:text-sky-500">People</a>, then chat with them here.
        </p>
    </div>

</main>

<div th:replace="~{fragments/notifications :: notifications}"></div>
<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
