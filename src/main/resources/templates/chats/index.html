<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>

<body class="min-h-screen bg-canvas font-sans antialiased">

<nav th:replace="~{fragments/nav :: nav}"></nav>

<!--/* Direct chats, most recent first. A dot marks the ones with something new. */-->
<main class="mx-auto max-w-5xl px-4 py-8 sm:px-6 lg:px-8">

    <div class="flex items-center justify-between gap-x-4">
        <div class="min-w-0">
            <p class="truncate text-sm font-medium text-gray-500" th:text="${account.name}">Company</p>
            <h1 class="text-2xl/8 font-bold tracking-tight text-gray-900">Chats</h1>
        </div>
        <a th:href="@{/{a}/chats/new(a=${account.id})}"
           class="inline-flex items-center rounded-md bg-sky-600 px-3 py-2 text-sm font-semibold text-white shadow-xs hover:bg-sky-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-600">
            New chat
        </a>
    </div>

    <ul id="chat-list" role="list" th:unless="${#lists.isEmpty(chats)}"
        class="mt-6 divide-y divide-gray-100 overflow-hidden rounded-xl bg-white shadow-xs ring-1 ring-gray-900/5">
        <li th:each="c : ${chats}" th:attr="data-chat-room=${c.room.id}"
            class="relative flex items-center gap-x-4 px-4 py-4 hover:bg-gray-50 sm:px-6">
            <span data-row-dot class="size-2 shrink-0 rounded-full" th:classappend="${c.unread} ? 'bg-red-500'">
                <span th:if="${c.unread}" class="sr-only">New</span>
            </span>

            <div class="relative size-10 shrink-0">
                <th:block th:if="${#lists.size(c.others) == 1}">
                    <img th:replace="~{fragments/ui :: avatar(${c.others[0]}, 'size-10')}">
                </th:block>
                <th:block th:if="${#lists.size(c.others) > 1}">
                    <img th:replace="~{fragments/ui :: avatar(${c.others[0]}, 'absolute top-0 left-0 size-7')}">
                    <img th:replace="~{fragments/ui :: avatar(${c.others[1]}, 'absolute right-0 bottom-0 size-7 ring-2 ring-white')}">
                </th:block>
            </div>

            <div class="min-w-0 flex-auto">
                <div class="flex items-baseline justify-between gap-x-4">
                    <a th:href="@{${c.url}}" data-row-title class="truncate text-sm/6"
                       th:classappend="${c.unread} ? 'font-semibold text-gray-900' : 'font-medium text-gray-700'">
                        <span class="absolute inset-0" aria-hidden="true"></span>
                        <span th:text="${c.title}">Name</span>
                    </a>
                    <time data-row-when class="shrink-0 text-xs text-gray-500" th:text="${c.when}"></time>
                </div>
                <p data-row-preview class="truncate text-sm text-gray-500" th:text="${c.preview}"></p>
            </div>
        </li>
    </ul>

    <!-- Empty state -->
    <a th:if="${#lists.isEmpty(chats)}" id="chat-list-empty" th:href="@{/{a}/chats/new(a=${account.id})}"
       class="mt-6 block w-full rounded-xl border-2 border-dashed border-gray-300 p-12 text-center hover:border-gray-400 focus:outline-2 focus:outline-offset-2 focus:outline-sky-600">
        <span class="block text-sm font-semibold text-gray-900">No chats yet</span>
        <span class="mt-1 block text-sm text-gray-500" th:text="'Start a chat with anyone in ' + ${account.name} + ', one-on-one or in a small group.'"></span>
    </a>

</main>

<div th:replace="~{fragments/notifications :: notifications}"></div>
<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
