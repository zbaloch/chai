<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>

<body class="min-h-screen bg-canvas font-sans antialiased">

<div th:replace="~{fragments/nav :: nav}"></div>

<main class="mx-auto max-w-4xl px-4 py-8 sm:px-6 lg:px-8">

    <nav th:replace="~{fragments/ui :: breadcrumbs(${project}, 'Files', @{/project/{id}/files(id=${project.id})})}"></nav>
    <h1 class="mt-2 text-2xl/8 font-bold tracking-tight text-gray-900 sm:text-3xl/9">Upload a file</h1>

    <form th:action="@{/project/{id}/file/new(id=${project.id})}" th:object="${activeStorageFile}" method="post" enctype="multipart/form-data"
          class="mt-8 rounded-xl bg-white shadow-xs ring-1 ring-gray-900/5">
        <div class="px-4 py-6 sm:p-8">
            <label for="multipartFile" class="block text-sm/6 font-medium text-gray-900" th:text="#{activeStorageFile.file.label}">File</label>
            <div class="mt-2 flex justify-center rounded-lg border border-dashed border-gray-900/25 px-6 py-10">
                <div class="text-center">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" class="mx-auto size-12 text-gray-300">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
                    </svg>
                    <input id="multipartFile" type="file" name="multipartFile" required
                           class="mt-4 block w-full text-sm text-gray-500 file:mr-4 file:rounded-md file:border-0 file:bg-indigo-50 file:px-3 file:py-2 file:text-sm file:font-semibold file:text-indigo-700 hover:file:bg-indigo-100"/>
                </div>
            </div>
            <p class="mt-2 text-sm text-red-600" th:if="${#fields.hasErrors('multipartFile')}" th:errors="*{multipartFile}"></p>
        </div>

        <div class="flex items-center justify-end gap-x-6 border-t border-gray-900/10 px-4 py-4 sm:px-8">
            <a th:href="@{/project/{id}/files(id=${project.id})}" class="text-sm/6 font-semibold text-gray-900">Cancel</a>
            <button type="submit"
                    class="rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-xs hover:bg-indigo-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">
                Upload file
            </button>
        </div>
    </form>

</main>

<div th:replace="~{fragments/notifications :: notifications}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
