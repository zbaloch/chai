<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>

<body class="min-h-screen bg-canvas font-sans antialiased">

<div th:replace="~{fragments/nav :: nav}"></div>

<main class="mx-auto max-w-4xl px-4 py-8 sm:px-6 lg:px-8">

    <nav th:replace="~{fragments/ui :: breadcrumbs(${project}, null, null)}"></nav>
    <div class="mt-2 flex items-start justify-between gap-x-4">
        <div class="min-w-0">
            <h1 class="text-2xl/8 font-bold tracking-tight text-gray-900 sm:text-3xl/9">Docs &amp; Files</h1>
            <p class="mt-1 text-sm text-gray-500">A place to store and organize assets and reference material.</p>
        </div>
        <a th:href="@{/project/{id}/file/new(id=${project.id})}"
           class="inline-flex shrink-0 items-center gap-x-1.5 rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-xs hover:bg-indigo-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">
            <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="-ml-0.5 size-5">
                <path d="M10.75 4.75a.75.75 0 0 0-1.5 0v4.5h-4.5a.75.75 0 0 0 0 1.5h4.5v4.5a.75.75 0 0 0 1.5 0v-4.5h4.5a.75.75 0 0 0 0-1.5h-4.5v-4.5Z" />
            </svg>
            Upload
        </a>
    </div>

    <ul role="list" th:unless="${#lists.isEmpty(activeStorageFiles)}"
        class="mt-8 grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
        <li th:each="activeStorageFile : ${activeStorageFiles}"
            class="group relative flex items-start gap-x-4 rounded-xl bg-white p-4 shadow-xs ring-1 ring-gray-900/5 transition hover:shadow-md hover:ring-gray-900/10">
            <span class="flex size-10 shrink-0 items-center justify-center rounded-lg bg-gray-50 text-gray-400 ring-1 ring-gray-900/5">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" class="size-5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
                </svg>
            </span>
            <div class="min-w-0">
                <a th:href="@{/project/{p}/file/{f}(p=${project.id},f=${activeStorageFile.id})}" target="_blank"
                   class="block truncate text-sm/6 font-semibold text-gray-900 group-hover:text-indigo-600">
                    <span class="absolute inset-0" aria-hidden="true"></span>
                    <span th:text="${activeStorageFile.fileName}">File name</span>
                </a>
                <p class="mt-0.5 text-xs/5 text-gray-500">
                    <span th:text="${activeStorageFile.user.firstName + ' ' + activeStorageFile.user.lastName.charAt(0) + '.'}">User</span>
                    · <span th:text="${#dates.format(activeStorageFile.createdAt.time, 'MMM d, yyyy')}">Date</span>
                </p>
            </div>
        </li>
    </ul>

    <!-- Empty state -->
    <a th:if="${#lists.isEmpty(activeStorageFiles)}" th:href="@{/project/{id}/file/new(id=${project.id})}"
       class="mt-8 block w-full rounded-xl border-2 border-dashed border-gray-300 p-12 text-center hover:border-gray-400 focus:outline-2 focus:outline-offset-2 focus:outline-indigo-600">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" class="mx-auto size-12 text-gray-400">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12.75V12A2.25 2.25 0 0 1 4.5 9.75h15A2.25 2.25 0 0 1 21.75 12v.75m-8.69-6.44-2.12-2.12a1.5 1.5 0 0 0-1.061-.44H4.5A2.25 2.25 0 0 0 2.25 6v12a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9a2.25 2.25 0 0 0-2.25-2.25h-5.379a1.5 1.5 0 0 1-1.06-.44Z" />
        </svg>
        <span class="mt-2 block text-sm font-semibold text-gray-900">No files yet</span>
        <span class="mt-1 block text-sm text-gray-500">Upload the first document for this project.</span>
    </a>

</main>

<div th:replace="~{fragments/notifications :: notifications}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
