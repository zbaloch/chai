<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>

<body class="min-h-screen bg-canvas font-sans antialiased">

<div th:replace="~{fragments/nav :: nav}"></div>

<main class="mx-auto max-w-4xl px-4 py-8 sm:px-6 lg:px-8"
      th:with="hasAny=${notifications != null and !notifications.isEmpty()}, unreadCount=${hasAny ? #lists.size(notifications.?[!read]) : 0}, readCount=${hasAny ? #lists.size(notifications.?[read]) : 0}">

    <nav th:replace="~{fragments/ui :: breadcrumbs(null, null, null)}"></nav>
    <h1 class="mt-2 text-2xl/8 font-bold tracking-tight text-gray-900 sm:text-3xl/9">Notifications</h1>
    <p class="mt-1 text-sm text-gray-500">Here’s every notification you’ve ever received.</p>

    <section th:if="${unreadCount > 0}" class="mt-8">
        <h2 class="flex items-center gap-x-2 text-sm font-semibold text-gray-900">
            New for you
            <span class="inline-flex items-center rounded-full bg-sky-50 px-2 py-0.5 text-xs font-medium text-sky-700" th:text="${unreadCount}">0</span>
        </h2>
        <ul role="list" class="mt-3 divide-y divide-gray-100 overflow-hidden rounded-xl bg-white shadow-xs ring-1 ring-gray-900/5">
            <th:block th:each="notification : ${notifications}" th:if="${!notification.read}">
                <li th:replace="~{fragments/notificationItem :: item(${notification})}"></li>
            </th:block>
        </ul>
    </section>

    <section th:if="${readCount > 0}" class="mt-10">
        <h2 class="text-sm font-semibold text-gray-500">Earlier</h2>
        <ul role="list" class="mt-3 divide-y divide-gray-100 overflow-hidden rounded-xl bg-white shadow-xs ring-1 ring-gray-900/5">
            <th:block th:each="notification : ${notifications}" th:if="${notification.read}">
                <li th:replace="~{fragments/notificationItem :: item(${notification})}"></li>
            </th:block>
        </ul>
    </section>

    <!-- Empty state -->
    <div th:unless="${hasAny}" class="mt-8 rounded-xl border-2 border-dashed border-gray-300 p-12 text-center">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" class="mx-auto size-12 text-gray-400">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0" />
        </svg>
        <h3 class="mt-2 text-sm font-semibold text-gray-900">You’re all caught up</h3>
        <p class="mt-1 text-sm text-gray-500">New messages, to-dos and comments will show up here.</p>
    </div>

</main>

<div th:replace="~{fragments/notifications :: notifications}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
