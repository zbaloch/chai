<div th:fragment="nav" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <div sec:authorize="isAuthenticated()">
        <form id="logoutForm" method="POST" th:action="@{/logout}">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        </form>

        <!-- Logged-in user navigation -->
        <nav class="border-b border-gray-900/5 bg-white/80 backdrop-blur-sm">
            <div class="mx-auto max-w-4xl px-4 sm:px-6 lg:px-8">
                <div class="flex h-16 items-center justify-between">
                    <div class="flex items-center gap-x-8">
                        <a th:href="@{/projects}" class="flex items-center">
                            <span class="text-base font-semibold tracking-tight text-gray-900" th:text="#{company.name}">Chai</span>
                        </a>
                        <div class="flex gap-x-1">
                            <a th:href="@{/projects}" data-nav="projects"
                               class="rounded-md px-3 py-2 text-sm font-medium text-gray-500 hover:bg-gray-900/5 hover:text-gray-900 data-active:bg-gray-900/5 data-active:text-gray-900">
                                Projects
                            </a>
                        </div>
                    </div>

                    <div class="flex items-center gap-x-4">
                        <a th:href="@{/hey}" id="nav-notifications" data-nav="hey" th:data-unread-url="@{/hasUnreadNotifications}"
                           class="relative rounded-full p-1.5 text-gray-400 hover:text-gray-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-600 data-active:text-gray-900">
                            <span class="absolute -inset-1.5"></span>
                            <span class="sr-only">View notifications</span>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" class="size-6">
                                <path d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0" stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                            <span data-unread-dot hidden class="absolute top-1 right-1 block size-2 rounded-full bg-red-500 ring-2 ring-white"></span>
                        </a>

                        <el-dropdown class="relative">
                            <button class="relative flex rounded-full focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-600">
                                <span class="absolute -inset-1.5"></span>
                                <span class="sr-only">Open user menu</span>
                                <img th:replace="~{fragments/ui :: avatar(${session.currentUser}, 'size-8')}">
                            </button>
                            <el-menu anchor="bottom end" popover
                                     class="w-56 origin-top-right divide-y divide-gray-100 rounded-md bg-white shadow-lg outline-1 outline-black/5 transition transition-discrete [--anchor-gap:--spacing(2)] data-closed:scale-95 data-closed:transform data-closed:opacity-0 data-enter:duration-100 data-enter:ease-out data-leave:duration-75 data-leave:ease-in">
                                <div class="px-4 py-3">
                                    <p class="text-sm text-gray-500">Signed in as</p>
                                    <p class="truncate text-sm font-medium text-gray-900" th:text="${session.currentUser.email}"></p>
                                </div>
                                <div class="py-1">
                                    <button type="submit" form="logoutForm"
                                            class="block w-full px-4 py-2 text-left text-sm text-gray-700 focus:bg-gray-100 focus:text-gray-900 focus:outline-hidden">
                                        Sign out
                                    </button>
                                </div>
                            </el-menu>
                        </el-dropdown>
                    </div>
                </div>
            </div>
        </nav>

        <script>
            (function () {
                // Highlight the current section. Thymeleaf 3.1 can't read the request URI, so do it client-side.
                var onHey = /\/hey\/?$/.test(location.pathname);
                document.querySelectorAll('[data-nav]').forEach(function (a) {
                    if ((a.dataset.nav === 'hey') === onHey) a.setAttribute('data-active', '');
                    else a.removeAttribute('data-active');
                });

                var link = document.getElementById('nav-notifications');
                if (!link || !window.fetch) return;
                fetch(link.dataset.unreadUrl, { headers: { 'Accept': 'application/json' } })
                    .then(function (r) { return r.ok ? r.json() : false; })
                    .then(function (hasUnread) { link.querySelector('[data-unread-dot]').hidden = !hasUnread; })
                    .catch(function () {});
            })();
        </script>
    </div>

    <div sec:authorize="isAnonymous()">
        <!-- Guest user navigation -->
        <nav class="border-b border-gray-900/5 bg-white/80 backdrop-blur-sm">
            <div class="mx-auto max-w-4xl px-4 sm:px-6 lg:px-8">
                <div class="flex h-16 items-center">
                    <a th:href="@{/projects}" class="flex items-center">
                        <span class="text-base font-semibold tracking-tight text-gray-900" th:text="#{company.name}">Chai</span>
                    </a>
                </div>
            </div>
        </nav>
    </div>
</div>
