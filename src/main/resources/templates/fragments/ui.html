<!--/* Shared UI building blocks (Tailwind Plus v4 styles). Include with th:replace="~{fragments/ui :: name(args)}". */-->
<th:block xmlns:th="http://www.thymeleaf.org">

<!--/* User avatar. `size` is extra classes, e.g. 'size-8' or 'size-8 ring-2 ring-white'. */-->
<img th:fragment="avatar(user, size)"
     th:class="${size} + ' shrink-0 rounded-full bg-gray-100 outline -outline-offset-1 outline-black/5'"
     th:src="@{'https://api.dicebear.com/10.x/initials/svg?seed=' + ${user.firstName} + '+' + ${user.lastName}}"
     th:alt="${user.firstName + ' ' + user.lastName}"
     th:title="${user.firstName + ' ' + user.lastName}">


<!--/* Breadcrumbs: Home › project › section. Pass null for any level that doesn't apply. */-->
<nav th:fragment="breadcrumbs(project, section, sectionHref)" aria-label="Breadcrumb" class="flex">
    <ol role="list" class="flex min-w-0 items-center gap-x-1.5 text-sm font-medium text-gray-500">
        <li>
            <a th:href="@{/projects}" class="hover:text-gray-700">Home</a>
        </li>
        <li th:if="${project != null}" class="flex min-w-0 items-center gap-x-1.5">
            <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="size-5 shrink-0 text-gray-400">
                <path fill-rule="evenodd" d="M8.22 5.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06-1.06L11.94 10 8.22 6.28a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd" />
            </svg>
            <a th:href="@{/project/{id}(id=${project.id})}" class="truncate hover:text-gray-700" th:text="${project.name}">Project</a>
        </li>
        <li th:if="${section != null}" class="flex items-center gap-x-1.5">
            <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="size-5 shrink-0 text-gray-400">
                <path fill-rule="evenodd" d="M8.22 5.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06-1.06L11.94 10 8.22 6.28a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd" />
            </svg>
            <a th:href="${sectionHref}" class="whitespace-nowrap hover:text-gray-700" th:text="${section}">Section</a>
        </li>
    </ol>
</nav>


<!--/* Inline success / error alerts driven by the `message` and `error` model attributes. */-->
<div th:fragment="alerts" class="space-y-4">
    <div th:if="${message != null}" class="rounded-md bg-green-50 p-4">
        <div class="flex">
            <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="size-5 shrink-0 text-green-400">
                <path fill-rule="evenodd" d="M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm3.857-9.809a.75.75 0 0 0-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 1 0-1.06 1.061l2.5 2.5a.75.75 0 0 0 1.137-.089l4-5.5Z" clip-rule="evenodd" />
            </svg>
            <p class="ml-3 text-sm font-medium text-green-800" th:text="${message}"></p>
        </div>
    </div>
    <div th:if="${error != null}" class="rounded-md bg-red-50 p-4">
        <div class="flex">
            <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="size-5 shrink-0 text-red-400">
                <path fill-rule="evenodd" d="M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16ZM8.28 7.22a.75.75 0 0 0-1.06 1.06L8.94 10l-1.72 1.72a.75.75 0 1 0 1.06 1.06L10 11.06l1.72 1.72a.75.75 0 1 0 1.06-1.06L11.06 10l1.72-1.72a.75.75 0 0 0-1.06-1.06L10 8.94 8.28 7.22Z" clip-rule="evenodd" />
            </svg>
            <p class="ml-3 text-sm font-medium text-red-800" th:text="${error}"></p>
        </div>
    </div>
</div>


<!--/*
    Destructive-action confirmation modal. Open it with:
      <button type="button" command="show-modal" commandfor="{id}">…</button>
    `href` is the (GET) URL that performs the action.
*/-->
<el-dialog th:fragment="confirmDialog(id, title, body, href, label)">
    <dialog th:id="${id}" th:attr="aria-labelledby=${id + '-title'}"
            class="fixed inset-0 size-auto max-h-none max-w-none overflow-y-auto bg-transparent backdrop:bg-transparent">
        <el-dialog-backdrop class="fixed inset-0 bg-gray-500/75 transition-opacity data-closed:opacity-0 data-enter:duration-300 data-enter:ease-out data-leave:duration-200 data-leave:ease-in"></el-dialog-backdrop>

        <div tabindex="0" class="flex min-h-full items-end justify-center p-4 text-center focus:outline-none sm:items-center sm:p-0">
            <el-dialog-panel class="relative transform overflow-hidden rounded-lg bg-white px-4 pt-5 pb-4 text-left shadow-xl transition-all data-closed:translate-y-4 data-closed:opacity-0 data-enter:duration-300 data-enter:ease-out data-leave:duration-200 data-leave:ease-in sm:my-8 sm:w-full sm:max-w-lg sm:p-6 data-closed:sm:translate-y-0 data-closed:sm:scale-95">
                <div class="sm:flex sm:items-start">
                    <div class="mx-auto flex size-12 shrink-0 items-center justify-center rounded-full bg-red-100 sm:mx-0 sm:size-10">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" class="size-6 text-red-600">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
                        </svg>
                    </div>
                    <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left">
                        <h3 th:id="${id + '-title'}" class="text-base font-semibold text-gray-900" th:text="${title}">Delete</h3>
                        <p class="mt-2 text-sm text-gray-500" th:text="${body}">Are you sure?</p>
                    </div>
                </div>
                <div class="mt-5 sm:mt-4 sm:flex sm:flex-row-reverse">
                    <a th:href="${href}" data-turbolinks="false"
                       class="inline-flex w-full justify-center rounded-md bg-red-600 px-3 py-2 text-sm font-semibold text-white shadow-xs hover:bg-red-500 sm:ml-3 sm:w-auto"
                       th:text="${label}">Delete</a>
                    <button type="button" command="close" th:attr="commandfor=${id}"
                            class="mt-3 inline-flex w-full justify-center rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 shadow-xs inset-ring inset-ring-gray-300 hover:bg-gray-50 sm:mt-0 sm:w-auto">
                        Cancel
                    </button>
                </div>
            </el-dialog-panel>
        </div>
    </dialog>
</el-dialog>

</th:block>
