<!DOCTYPE html>
<html lang="en" class="h-full" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>

<body class="h-full bg-canvas font-sans antialiased">

<div class="flex min-h-full flex-col justify-center py-12 sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <h2 class="text-center text-2xl/9 font-bold tracking-tight text-gray-900">
            Reset your password
        </h2>
        <p class="mt-2 text-center text-sm/6 text-gray-500">
            Remembered it?
            <a th:href="@{/login}" class="font-semibold text-sky-600 hover:text-sky-500">Sign in</a>
        </p>
    </div>

    <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-[480px]">
        <div th:replace="~{fragments/ui :: alerts}"></div>

        <div class="mt-4 bg-white px-6 py-10 shadow-xs ring-1 ring-gray-900/5 sm:rounded-xl sm:px-12">
            <form th:action="@{/reset}" th:object="${userForm}" method="post" class="space-y-6">
                <div>
                    <label for="username" class="block text-sm/6 font-medium text-gray-900">Email address</label>
                    <div class="mt-2">
                        <input th:field="*{username}" type="email" id="username" autocomplete="email" required
                               class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-sky-600 sm:text-sm/6">
                    </div>
                </div>

                <button type="submit"
                        class="flex w-full justify-center rounded-md bg-sky-600 px-3 py-2 text-sm/6 font-semibold text-white shadow-xs hover:bg-sky-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-600">
                    Reset password
                </button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
