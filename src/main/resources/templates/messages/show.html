<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>

<body class="min-h-screen bg-canvas font-sans antialiased">

<div th:replace="~{fragments/nav :: nav}"></div>

<main class="mx-auto max-w-4xl px-4 py-8 sm:px-6 lg:px-8">

    <nav th:replace="~{fragments/ui :: breadcrumbs(${project}, 'Messages', @{/project/{id}/messages(id=${project.id})})}"></nav>

    <!-- Message -->
    <article class="mt-4 rounded-xl bg-white shadow-xs ring-1 ring-gray-900/5">
        <header class="border-b border-gray-900/5 px-4 py-6 sm:px-8">
            <div class="flex items-start justify-between gap-x-4">
                <h1 class="text-2xl/8 font-bold tracking-tight text-gray-900" th:text="${message.title}">Title</h1>
                <a th:if="${message.user.id == currentUser.id}"
                   th:href="@{/project/{projectId}/message/{messageId}/edit(projectId=${project.id},messageId=${message.id})}"
                   class="shrink-0 rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 shadow-xs inset-ring inset-ring-gray-300 hover:bg-gray-50">
                    Edit
                </a>
            </div>
            <div class="mt-4 flex items-center gap-x-3">
                <img th:replace="~{fragments/ui :: avatar(${message.user}, 'size-8')}">
                <div class="text-sm/5">
                    <p class="font-semibold text-gray-900" th:text="${message.user.firstName + ' ' + message.user.lastName}"></p>
                    <p class="text-gray-500">
                        <span th:text="${#dates.format(message.createdAt.time, 'MMM d, yyyy')}"></span>
                        at <span th:text="${#dates.format(message.createdAt.time, 'h:mm a')}"></span>
                    </p>
                </div>
            </div>
        </header>
        <div class="lexxy-content px-4 py-6 text-base/7 text-gray-700 sm:px-8" th:utext="${message.content}"></div>
    </article>

    <!-- Comments -->
    <section aria-labelledby="comments-heading" class="mt-10">
        <h2 id="comments-heading" class="flex items-center gap-x-2 text-base font-semibold text-gray-900">
            Comments
            <span data-comment-count
                  class="inline-flex items-center rounded-full bg-gray-900/5 px-2 py-0.5 text-xs font-medium text-gray-600"
                  th:text="${#lists.size(message.comments)}">0</span>
        </h2>

        <ul role="list" class="mt-6 space-y-6">
            <li th:each="comment : ${message.comments}" th:id="'comment_' + ${comment.id}" class="flex gap-x-4">
                <img th:replace="~{fragments/ui :: avatar(${comment.user}, 'size-10')}">
                <div class="min-w-0 flex-auto rounded-xl bg-white p-4 shadow-xs ring-1 ring-gray-900/5">
                    <div class="flex items-start justify-between gap-x-4">
                        <p class="text-sm/6">
                            <span class="font-semibold text-gray-900" th:text="${comment.user.firstName + ' ' + comment.user.lastName}"></span>
                            <span class="ml-1 text-gray-500">
                                <span th:text="${#dates.format(comment.createdAt.time, 'MMM d, yyyy')}"></span>
                                at <span th:text="${#dates.format(comment.createdAt.time, 'h:mm a')}"></span>
                            </span>
                        </p>
                        <button th:if="${currentUser.id == comment.user.id}" type="button"
                                th:data-delete-url="@{/project/{p}/message/{m}/comment/{c}/delete(p=${project.id},m=${message.id},c=${comment.id})}"
                                th:data-comment-id="${comment.id}"
                                onclick="deleteComment(this)"
                                class="-m-1.5 shrink-0 rounded-md p-1.5 text-gray-400 hover:bg-red-50 hover:text-red-600">
                            <span class="sr-only">Delete comment</span>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="size-4">
                                <path d="M10 11v6" />
                                <path d="M14 11v6" />
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
                                <path d="M3 6h18" />
                                <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                            </svg>
                        </button>
                    </div>
                    <div class="lexxy-content mt-1 text-sm/6 text-gray-700" th:utext="${comment.text}"></div>
                </div>
            </li>
        </ul>

        <!-- New comment -->
        <div id="comment_form" class="mt-8 flex gap-x-4">
            <img th:replace="~{fragments/ui :: avatar(${currentUser}, 'size-10')}">
            <form th:action="@{/project/{projectId}/message/{messageId}/comment(projectId=${project.id},messageId=${message.id})}"
                  th:object="${comment}" method="post" class="min-w-0 flex-auto">
                <lexxy-editor name="text" th:value="*{text}" class="lexxy-content editor-comment" placeholder="Add a comment…"></lexxy-editor>
                <p class="mt-2 text-sm text-red-600" th:if="${#fields.hasErrors('text')}" th:errors="*{text}"></p>
                <div class="mt-3 flex justify-end">
                    <button type="submit"
                            class="rounded-md bg-sky-600 px-3 py-2 text-sm font-semibold text-white shadow-xs hover:bg-sky-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-600">
                        Add comment
                    </button>
                </div>
            </form>
        </div>
    </section>

</main>

<div th:replace="~{fragments/notifications :: notifications}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    function deleteComment(button) {
        if (!confirm('Delete this comment?')) return;
        fetch(button.dataset.deleteUrl, { method: 'DELETE' })
            .then(function (response) {
                if (!response.ok) throw new Error(response.status);
                document.getElementById('comment_' + button.dataset.commentId).remove();
                var count = document.querySelector('[data-comment-count]');
                if (count) count.textContent = Math.max(0, Number(count.textContent) - 1);
            })
            .catch(function (error) { console.error('Failed to delete comment:', error); });
    }
</script>

</body>
</html>
