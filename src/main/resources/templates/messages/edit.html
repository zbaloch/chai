<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>

<body class="min-h-screen bg-canvas font-sans antialiased">

<div th:replace="~{fragments/nav :: nav}"></div>

<main class="mx-auto max-w-4xl px-4 py-8 sm:px-6 lg:px-8">

    <nav th:replace="~{fragments/ui :: breadcrumbs(${project}, 'Messages', @{/project/{id}/messages(id=${project.id})})}"></nav>
    <h1 class="mt-2 text-2xl/8 font-bold tracking-tight text-gray-900 sm:text-3xl/9">Edit message</h1>

    <form th:object="${message}" th:action="@{/project/{projectId}/message/{messageId}/edit(projectId=${project.id}, messageId=${message.id})}" method="post"
          class="mt-8 rounded-xl bg-white shadow-xs ring-1 ring-gray-900/5">
        <div class="space-y-6 px-4 py-6 sm:p-8">
            <div>
                <label for="title" class="sr-only">Title</label>
                <input th:field="*{title}" type="text" placeholder="Type a title…"
                       class="block w-full border-0 bg-transparent px-0 py-1 text-xl font-semibold text-gray-900 placeholder:text-gray-300 focus:outline-none" />
                <p class="mt-2 text-sm text-red-600" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p>
            </div>

            <div>
                <input type="hidden" th:id="'message-content-' + ${message.id}" name="content" th:value="${message.contentToDisplay}"/>
                <trix-editor th:attr="input='message-content-' + ${message.id}" class="trix-editor-message" style="min-height: 300px;"></trix-editor>
                <p class="mt-2 text-sm text-red-600" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></p>
            </div>
        </div>

        <div class="flex items-center justify-between gap-x-6 border-t border-gray-900/10 px-4 py-4 sm:px-8">
            <button type="button" command="show-modal" commandfor="delete-message"
                    class="text-sm/6 font-semibold text-red-600 hover:text-red-500">
                Delete
            </button>
            <div class="flex items-center gap-x-6">
                <a th:href="@{/project/{projectId}/message/{messageId}(projectId=${project.id}, messageId=${message.id})}" class="text-sm/6 font-semibold text-gray-900">Cancel</a>
                <button type="submit"
                        class="rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-xs hover:bg-indigo-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">
                    Save changes
                </button>
            </div>
        </div>
    </form>

    <el-dialog th:replace="~{fragments/ui :: confirmDialog('delete-message', 'Delete message', 'This message and its comments will be deleted. This can’t be undone.', @{/project/{projectId}/message/{messageId}/delete(projectId=${project.id}, messageId=${message.id})}, 'Delete message')}"></el-dialog>

</main>

<div th:replace="~{fragments/notifications :: notifications}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
