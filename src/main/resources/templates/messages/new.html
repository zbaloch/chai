<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>

<body class="min-h-screen bg-canvas font-sans antialiased">

<div th:replace="~{fragments/nav :: nav}"></div>

<main class="mx-auto max-w-4xl px-4 py-8 sm:px-6 lg:px-8">

    <nav th:replace="~{fragments/ui :: breadcrumbs(${project}, 'Messages', @{/project/{id}/messages(id=${project.id})})}"></nav>
    <h1 class="mt-2 text-2xl/8 font-bold tracking-tight text-gray-900 sm:text-3xl/9">New message</h1>

    <form th:action="@{/project/{id}/message/new(id=${project.id})}" th:object="${message}" method="post"
          class="mt-8 rounded-xl bg-white shadow-xs ring-1 ring-gray-900/5">
        <div class="space-y-6 px-4 py-6 sm:p-8">
            <div>
                <label for="title" class="sr-only">Title</label>
                <input th:field="*{title}" type="text" placeholder="Type a title…" autofocus
                       class="block w-full border-0 bg-transparent px-0 py-1 text-xl font-semibold text-gray-900 placeholder:text-gray-300 focus:outline-none" />
                <p class="mt-2 text-sm text-red-600" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p>
            </div>

            <div>
                <lexxy-editor name="content" th:value="*{content}" class="lexxy-content editor-message" placeholder="Write away…"></lexxy-editor>
                <p class="mt-2 text-sm text-red-600" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></p>
            </div>
        </div>

        <div class="flex items-center justify-end gap-x-6 border-t border-gray-900/10 px-4 py-4 sm:px-8">
            <a th:href="@{/project/{id}/messages(id=${project.id})}" class="text-sm/6 font-semibold text-gray-900">Cancel</a>
            <button type="submit"
                    class="rounded-md bg-sky-600 px-3 py-2 text-sm font-semibold text-white shadow-xs hover:bg-sky-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-600">
                Post message
            </button>
        </div>
    </form>

</main>

<div th:replace="~{fragments/notifications :: notifications}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
