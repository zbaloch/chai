<!--/*
    A page of chat messages, oldest first: day dividers, the "New" line, and the messages.
    Used by chat/index and returned on its own for "Load earlier messages".
    Needs chatMessages, canModerate and earlierUrl (null when there's nothing earlier).
*/-->
<th:block th:fragment="list" xmlns:th="http://www.thymeleaf.org">
    <li th:if="${earlierUrl != null}" data-load-earlier class="pt-3 pb-1 text-center">
        <button type="button" th:attr="data-url=@{${earlierUrl}}"
                class="rounded-md px-2.5 py-1.5 text-sm font-semibold text-sky-600 hover:bg-sky-50 hover:text-sky-500">
            Load earlier messages
        </button>
    </li>

    <th:block th:each="m : ${chatMessages}">
        <li th:if="${m.dayLabel != null}" data-day-separator th:attr="data-day=${#dates.format(m.createdAt.time, 'yyyy-MM-dd')}"
            class="flex items-center gap-x-3 pt-5 pb-1">
            <span class="h-px flex-auto bg-gray-100"></span>
            <span class="text-xs font-medium text-gray-500" th:text="${m.dayLabel}">Today</span>
            <span class="h-px flex-auto bg-gray-100"></span>
        </li>
        <li th:if="${m.firstUnread}" data-new-line class="flex items-center gap-x-3 pt-4 pb-1">
            <span class="h-px flex-auto bg-red-500/40"></span>
            <span class="text-xs font-semibold text-red-600">New</span>
            <span class="h-px flex-auto bg-red-500/40"></span>
        </li>
        <li th:id="'chat_message_' + ${m.id}"
            class="chat-message group relative -mx-2 flex gap-x-3 rounded-lg px-2 pt-3 pb-0.5"
            th:classappend="${m.mentionsMe} ? 'bg-amber-50'"
            th:title="${#dates.format(m.createdAt.time, 'MMM d, yyyy')} + ' at ' + ${#dates.format(m.createdAt.time, 'h:mm a')}"
            th:attr="data-sender-id=${m.user.id}, data-created-at=${m.createdAt.timeInMillis}, data-day=${#dates.format(m.createdAt.time, 'yyyy-MM-dd')}, data-continued=${m.continued}">
            <img th:replace="~{fragments/ui :: avatar(${m.user}, 'chat-avatar size-9')}">
            <div class="min-w-0 flex-auto pr-14">
                <p class="chat-head text-sm/6">
                    <span class="font-semibold text-gray-900" th:text="${m.user.firstName + ' ' + m.user.lastName}">Name</span>
                    <time class="ml-1 text-xs text-gray-500" th:text="${#dates.format(m.createdAt.time, 'h:mm a')}">10:42 AM</time>
                </p>
                <div class="text-sm/6 break-words text-gray-700"><span data-body th:utext="${m.html}">Message</span> <span data-edited th:hidden="${m.editedAt == null}" class="text-xs text-gray-400">(edited)</span></div>
            </div>
            <div class="absolute top-2 right-2 flex gap-x-0.5 opacity-0 group-hover:opacity-100 focus-within:opacity-100">
                <button th:if="${m.user.id == session.currentUser.id}" type="button" th:attr="data-edit=${m.id}"
                        class="rounded-md p-1 text-gray-400 hover:bg-gray-100 hover:text-gray-700">
                    <span class="sr-only">Edit message</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="size-4">
                        <path d="M12 20h9" />
                        <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z" />
                    </svg>
                </button>
                <button th:if="${m.user.id == session.currentUser.id or canModerate}" type="button" th:attr="data-delete=${m.id}"
                        class="rounded-md p-1 text-gray-400 hover:bg-red-50 hover:text-red-600">
                    <span class="sr-only">Delete message</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="size-4">
                        <path d="M10 11v6" />
                        <path d="M14 11v6" />
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
                        <path d="M3 6h18" />
                        <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                    </svg>
                </button>
            </div>
        </li>
    </th:block>
</th:block>
