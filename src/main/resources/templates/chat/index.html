<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>

<body class="min-h-screen bg-canvas font-sans antialiased">

<div th:replace="~{fragments/nav :: nav}"></div>

<main class="mx-auto max-w-4xl px-4 py-8 sm:px-6 lg:px-8">

    <nav th:replace="~{fragments/ui :: breadcrumbs(${project}, null, null)}"></nav>
    <h1 class="mt-2 text-2xl/8 font-bold tracking-tight text-gray-900 sm:text-3xl/9">Chat</h1>

    <div class="mt-8 flex flex-col overflow-hidden rounded-xl bg-white shadow-xs ring-1 ring-gray-900/5" style="height: calc(100vh - 260px);">
        <!-- Chat messages -->
        <ul role="list" id="chat-window" class="flex-1 space-y-5 overflow-y-auto px-4 py-6 sm:px-6">
            <li th:each="chatMessage : ${chatMessages}" th:id="'chat_message_' + ${chatMessage.id}" class="group flex gap-x-3">
                <img th:replace="~{fragments/ui :: avatar(${chatMessage.user}, 'size-9')}">
                <div class="min-w-0 flex-auto">
                    <div class="flex items-baseline justify-between gap-x-4">
                        <p class="text-sm/6">
                            <span class="font-semibold text-gray-900" th:text="${chatMessage.user.firstName + ' ' + chatMessage.user.lastName}">User Name</span>
                            <span class="ml-1 text-xs text-gray-500">
                                <span th:text="${#dates.format(chatMessage.createdAt.time, 'MMM d, yyyy')}">Date</span>
                                at <span th:text="${#dates.format(chatMessage.createdAt.time, 'h:mm a')}">Time</span>
                            </span>
                        </p>
                        <a th:if="${chatMessage.user.id == session.currentUser.id}"
                           th:onclick="|deleteChatMessage(${project.id}, ${chatMessage.id})|"
                           class="cursor-pointer rounded-md p-1 text-gray-400 opacity-0 group-hover:opacity-100 hover:bg-red-50 hover:text-red-600">
                            <span class="sr-only">Delete message</span>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="size-4">
                                <path d="M10 11v6" />
                                <path d="M14 11v6" />
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
                                <path d="M3 6h18" />
                                <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                            </svg>
                        </a>
                    </div>
                    <p class="text-sm/6 text-gray-700" th:text="${chatMessage.message}">Message Content</p>
                </div>
            </li>
        </ul>

        <!-- Composer -->
        <div class="border-t border-gray-900/5 p-4">
            <label for="chatMessageInput" class="sr-only">Message</label>
            <input id="chatMessageInput" type="text" placeholder="Type your message…" value="" autocomplete="off"
                   class="block w-full rounded-md bg-white px-3 py-2 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-sky-600 sm:text-sm/6"/>
        </div>
    </div>

</main>

<div th:replace="~{fragments/notifications :: notifications}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>

<input type="hidden" id="user.username" th:value="${session.currentUser.email}"/>
<input type="hidden" id="user.id" th:value="${session.currentUser.id}"/>
<input type="hidden" id="user.firstName" th:value="${session.currentUser.firstName}"/>
<input type="hidden" id="user.lastName" th:value="${session.currentUser.lastName}"/>
<input type="hidden" id="user.initials" th:value="${'' + session.currentUser.firstName.charAt(0) + session.currentUser.lastName.charAt(0)}"/>
<input type="hidden" id="project.id" th:value="${project.id}"/>
<input type="hidden" id="isChatPage" value="true"/>
<input type="hidden" id="chat.contextUrl" th:value="@{/}"/>

</body>
</html>
