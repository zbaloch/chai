<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>

<body class="min-h-screen bg-canvas font-sans antialiased">

<nav th:replace="~{fragments/nav :: nav}"></nav>

<main class="mx-auto max-w-4xl px-4 py-8 sm:px-6 lg:px-8">

    <nav th:replace="~{fragments/ui :: breadcrumbs(null, null, null)}"></nav>
    <h1 class="mt-2 text-2xl/8 font-bold tracking-tight text-gray-900 sm:text-3xl/9">My profile</h1>

    <form th:object="${userForm}" th:action="@{/profile}" method="post"
          class="mt-8 rounded-xl bg-white shadow-xs ring-1 ring-gray-900/5">
        <div class="grid max-w-2xl grid-cols-1 gap-x-6 gap-y-8 px-4 py-6 sm:grid-cols-6 sm:p-8">

            <div class="sm:col-span-6">
                <label for="email" class="block text-sm/6 font-medium text-gray-900">Email address</label>
                <div class="mt-2">
                    <input th:field="*{email}" type="email" readonly="readonly"
                           class="block w-full cursor-not-allowed rounded-md bg-gray-50 px-3 py-1.5 text-base text-gray-500 outline-1 -outline-offset-1 outline-gray-200 sm:text-sm/6" />
                </div>
                <p class="mt-2 text-sm text-red-600" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
            </div>

            <div class="sm:col-span-3">
                <label for="firstName" class="block text-sm/6 font-medium text-gray-900" th:text="#{user.firstName.label}">First name</label>
                <div class="mt-2">
                    <input th:field="*{firstName}" type="text" autocomplete="given-name"
                           class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-sky-600 sm:text-sm/6" />
                </div>
                <p class="mt-2 text-sm text-red-600" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></p>
            </div>

            <div class="sm:col-span-3">
                <label for="lastName" class="block text-sm/6 font-medium text-gray-900" th:text="#{user.lastName.label}">Last name</label>
                <div class="mt-2">
                    <input th:field="*{lastName}" type="text" autocomplete="family-name"
                           class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-sky-600 sm:text-sm/6" />
                </div>
                <p class="mt-2 text-sm text-red-600" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></p>
            </div>

        </div>

        <div class="flex items-center justify-end gap-x-6 border-t border-gray-900/10 px-4 py-4 sm:px-8">
            <a th:href="@{/projects}" class="text-sm/6 font-semibold text-gray-900">Cancel</a>
            <button type="submit"
                    class="rounded-md bg-sky-600 px-3 py-2 text-sm font-semibold text-white shadow-xs hover:bg-sky-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-600">
                Save
            </button>
        </div>
    </form>

</main>

<div th:replace="~{fragments/notifications :: notifications}"></div>
<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
